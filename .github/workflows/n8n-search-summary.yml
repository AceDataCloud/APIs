name: n8n search summary workflow

on:
  push:
    branches: [main]
    paths: ["workflows/n8n/**", "tests/test_n8n_search_summary.py", "scripts/check_n8n_search_summary.sh", ".github/workflows/n8n-search-summary.yml"]
  pull_request:
    branches: [main]
    paths: ["workflows/n8n/**", "tests/test_n8n_search_summary.py", "scripts/check_n8n_search_summary.sh", ".github/workflows/n8n-search-summary.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: pip install 'PyYAML>=6,<7' 'openapi-spec-validator>=0.7,<0.8'
      - run: python -m unittest discover -s tests -v
      - name: Free import and missing-credential boundary in pinned host
        run: |
          mkdir -p "$RUNNER_TEMP/n8n-search-summary-evidence"
          docker run --rm --network none --user 0:0 \
            --entrypoint /bin/sh \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP/n8n-search-summary-evidence:/evidence" \
            -e N8N_USER_FOLDER=/tmp/n8n-search-summary \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            -e N8N_ENCRYPTION_KEY=ci-only-search-summary-key \
            -e N8N_EXPRESSION_ENGINE=quickjs \
            docker.n8n.io/n8nio/n8n:2.43.7 \
            /workspace/scripts/check_n8n_search_summary.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: n8n-search-summary-free-host
          path: ${{ runner.temp }}/n8n-search-summary-evidence
