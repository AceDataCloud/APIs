name: Sync to Sub-Repos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_all:
        description: Sync all directories (bypass change detection)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install 'PyYAML>=6,<7'
      # scripts/sync_matrix.py reads sync.yaml, including hyphenated service names.
      - name: Detect changed subdirectories
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SYNC_ALL: ${{ inputs.sync_all }}
        run: |
          if [ "$SYNC_ALL" = "true" ]; then
            python scripts/sync_matrix.py --all
          else
            python scripts/sync_matrix.py
          fi

  sync:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Sync ${{ matrix.dir }} to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.SYNC_TOKEN }}
          MIRROR_DIRECTORY: ${{ matrix.dir }}
          MIRROR_REPOSITORY: ${{ matrix.repo }}
          MIRROR_EXCLUDES: ${{ toJson(matrix.exclude) }}
          CREATE_MISSING: ${{ matrix.create_missing }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/$MIRROR_DIRECTORY/README.md"
          gh auth setup-git
          if [ "$CREATE_MISSING" = "true" ] && ! gh repo view "$MIRROR_REPOSITORY" --json name >/dev/null; then
            gh repo create "$MIRROR_REPOSITORY" --public
          fi
          gh repo clone "$MIRROR_REPOSITORY" /tmp/target
          git -C /tmp/target config user.name "Ace Data Cloud Dev"
          git -C /tmp/target config user.email "dev@acedata.cloud"
          git -C /tmp/target checkout -B main

          mapfile -t configured_excludes < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["MIRROR_EXCLUDES"])))')
          exclude_args=()
          for pattern in "${configured_excludes[@]}"; do
            if [ -n "$pattern" ]; then exclude_args+=("--exclude=$pattern"); fi
          done
          rsync -av --delete \
            --exclude='.git' \
            --exclude='LICENSE*' \
            --exclude='CONTRIBUTING*' \
            --exclude='CODE_OF_CONDUCT*' \
            --exclude='SECURITY*' \
            "${exclude_args[@]}" \
            "$GITHUB_WORKSPACE/$MIRROR_DIRECTORY/" /tmp/target/

          git -C /tmp/target add -A
          if git -C /tmp/target diff --cached --quiet; then
            echo "No changes to sync for $MIRROR_DIRECTORY"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:%s)
          git -C /tmp/target commit -m "sync: $COMMIT_MSG" -m "Synced from monorepo directory: $MIRROR_DIRECTORY"
          git -C /tmp/target push origin main
