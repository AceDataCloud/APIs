name: Sync workflow tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install 'PyYAML>=6,<7' 'openapi-spec-validator>=0.7,<0.8'
      - run: python -m unittest discover -s tests -v
