name: README Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/test_check_readme_acquisition.py
      - run: python3 scripts/check_readme_acquisition.py
      - run: python3 scripts/test_check_suno_onboarding.py
      - run: python3 scripts/check_suno_onboarding.py
