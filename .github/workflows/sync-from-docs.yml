name: Sync from Docs

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Docs commit SHA (leave empty to resolve current main)
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-content-sync
  cancel-in-progress: false

jobs:
  create-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate sync token
        env:
          SYNC_GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$SYNC_GH_TOKEN" ]; then
            echo "::error::Missing GitHub token. Set ADMIN_GITHUB_TOKEN or BOT_GITHUB_TOKEN."
            exit 1
          fi

      - name: Resolve source request
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.client_payload.commit_sha }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          sha="$EVENT_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then sha="$MANUAL_SHA"; fi
          if [ -z "$sha" ] && [ "$EVENT_NAME" = workflow_dispatch ]; then
            sha=main
          elif ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full Docs source SHA is required."
            exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout Docs
        uses: actions/checkout@v4
        with:
          repository: AceDataCloud/Docs
          ref: ${{ steps.source.outputs.ref }}
          path: _docs
          token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Get Docs changes
        id: docs
        env:
          CHANGED_SERVICES: ${{ github.event.client_payload.changed_services }}
        run: |
          cd _docs
          commit_info=$(git log -1 --pretty=format:"%h %s" 2>/dev/null || echo "unknown")
          echo "commit_info=$commit_info" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          recent_changes=$(git log --oneline -5 2>/dev/null || echo "unknown")
          echo "recent_changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$recent_changes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          changed_services="$CHANGED_SERVICES"
          if [ -z "$changed_services" ]; then
            changed_services="all"
          fi
          if ! [[ "$changed_services" =~ ^[a-z0-9_-]+(,[a-z0-9_-]+)*$ ]]; then
            echo "::error::Expected comma-separated service aliases."
            exit 1
          fi
          echo "changed_services=$changed_services" >> "$GITHUB_OUTPUT"

      - name: Create issue for Copilot
        id: create-issue
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.docs.outputs.source_sha }}
          COMMIT_INFO: ${{ steps.docs.outputs.commit_info }}
          RECENT_CHANGES: ${{ steps.docs.outputs.recent_changes }}
          CHANGED_SERVICES: ${{ steps.docs.outputs.changed_services }}
          REPO: ${{ github.repository }}
        run: |
          marker="<!-- docs-content-sync:$SOURCE_SHA -->"
          existing=$(gh issue list --repo "$REPO" --state open --label auto-sync \
            --search "$SOURCE_SHA in:body" --limit 1000 --json number,body \
            --jq ".[] | select(.body | contains(\"$marker\")) | .number")
          if [ -n "$existing" ]; then
            echo "This Docs snapshot already has an open review issue."
            exit 0
          fi
          body=$(jq -nr \
            --arg changes "$RECENT_CHANGES" \
            --arg services "$CHANGED_SERVICES" \
            '"The upstream Docs have been updated. Ensure the affected API documentation in this monorepo is in sync.\n\n## Changed Services\n\n`" + $services + "`\n\n## Recent Docs Changes\n\n```\n" + $changes + "\n```\n\n## Instructions\n\nThis is a monorepo with API documentation in subdirectories (luma/, suno/, etc.).\n\nCheck the AceDataCloud/Docs repo for guides and OpenAPI specs.\n\nCompare against the corresponding subdirectory'\''s docs/ markdown files. Update any outdated information.\n\nUse the changed-services list as a hint; check the complete source snapshot for relevant content changes. If everything is already in sync, close this issue."')

          body=$(printf '%s\n\nSource: https://github.com/AceDataCloud/Docs/tree/%s\n\n%s\n\nReview this complete snapshot, including any changed services not listed in the hint. Preserve hand-written examples and normal CI/review gates. Do not close existing PRs or bypass checks.\n' "$body" "$SOURCE_SHA" "$marker")

          ISSUE_JSON=$(jq -n \
            --arg title "sync: update from Docs ($COMMIT_INFO)" \
            --arg body "$body" \
            '{title: $title, body: $body, labels: ["auto-sync"]}' \
            | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/"$REPO"/issues \
              --input -)
          ISSUE_NUM=$(echo "$ISSUE_JSON" | jq -r '.number')
          ISSUE_NODE=$(echo "$ISSUE_JSON" | jq -r '.node_id')
          echo "Created issue #$ISSUE_NUM (node=$ISSUE_NODE)"

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"
          COPILOT_ID=$(gh api graphql \
            -f query='query($owner:String!,$name:String!){ repository(owner:$owner,name:$name){ suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:50){ nodes { __typename ... on Bot { login id } ... on User { login id } } } } }' \
            -f owner="$OWNER" -f name="$NAME" \
            --jq '[.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent" or .login=="Copilot")] | .[0].id // empty')

          if [ -z "$COPILOT_ID" ]; then
            echo "::error::Copilot not found in suggestedActors. ADMIN_GITHUB_TOKEN must belong to a user with a Copilot seat in this org."
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "Auto-assignment failed: Copilot not visible to ADMIN_GITHUB_TOKEN. Please assign Copilot manually." || true
            exit 1
          fi

          gh api graphql \
            -f query='mutation($a:ID!,$b:[ID!]!){ replaceActorsForAssignable(input:{assignableId:$a, actorIds:$b}){ assignable { ... on Issue { number assignees(first:5){ nodes { login } } } } } }' \
            -f a="$ISSUE_NODE" -f b="$COPILOT_ID"
