  /acemusic/tasks:
    post:
      operationId: getTaskResults
      summary: ACE Music Tasks
      description: 'Retrieve only tasks owned by the authenticated caller. Polling is free and remains
        available with a zero balance; authentication and API permissions are required. Full input requirements:
        https://platform.acedata.cloud/documents/acemusic-tasks A non-null response can be a progress
        snapshot. Require terminal success and a non-empty primary media URL or content, not just a cover
        image or an empty data array.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - retrieve
                  - retrieve_batch
                  - list
                id:
                  type: string
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                page:
                  type: integer
                  minimum: 1
                  default: 1
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
              oneOf:
              - properties:
                  action:
                    enum:
                    - retrieve
                required:
                - id
              - properties:
                  action:
                    enum:
                    - retrieve_batch
                required:
                - ids
              - properties:
                  action:
                    enum:
                    - list
