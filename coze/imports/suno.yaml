openapi: 3.0.1
info:
  title: Suno
  version: 2.0.0
  description: 'Create songs and lyrics, extend or transform tracks, manage supported personas and studio
    projects, and retrieve music or export formats with Suno. Bind your own Ace Data Cloud credential
    privately as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never place
    a token in chat or shared examples. Start: https://platform.acedata.cloud/services/f2b646d8-3cfd-46ef-969a-1ea9eebde329?from=coze&utm_source=coze&utm_medium=referral&utm_campaign=evergreen&utm_content=coze_suno_setup'
servers:
- url: https://api.acedata.cloud
paths:
  /suno/audios:
    post:
      summary: Suno AI music generation API, generates 2 songs per request with extension support.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique ID of this result
                        lyric:
                          type: string
                          description: Generate lyrics for the content.
                        model:
                          type: string
                          description: Model used for generation
                        state:
                          type: string
                          description: Generate status, for example, `succeeded` indicates successful
                            generation.
                        style:
                          type: string
                          description: Style of content generation
                        title:
                          type: string
                          description: Title of Generated Content
                        prompt:
                          type: string
                          description: Prompts used during generation
                        duration:
                          type: number
                          description: Duration, measured in seconds
                        stem_set:
                          type: integer
                          minimum: 1
                          description: Candidate group ID to which the `extract_stem` result belongs;
                            the same ID includes the target audio track and its complementary audio track.
                        audio_url:
                          type: string
                          description: The URL of the generated audio file
                        image_url:
                          type: string
                          description: URL of the cover or preview image
                        video_url:
                          type: string
                          description: The URL of the generated video file, if not available, is an empty
                            string.
                        created_at:
                          type: string
                          description: The creation time of this result
                    description: Music playlist generated based on the prompts
                  success:
                    type: boolean
                    description: A flag indicating whether this request was successful.
                  task_id:
                    type: string
                    description: The unique ID of this task, which can be used to obtain the processing
                      results of the asynchronous task through the corresponding task query interface.
                  trace_id:
                    type: string
                    description: The tracking ID for this request, used for issue troubleshooting.
                  stem_sets:
                    type: array
                    items:
                      type: object
                      required:
                      - stem_type
                      - isolated
                      - remainder
                      properties:
                        isolated:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The unique ID of this result
                            lyric:
                              type: string
                              description: Generate lyrics for the content.
                            model:
                              type: string
                              description: Model used for generation
                            state:
                              type: string
                              description: Generate status, for example, `succeeded` indicates successful
                                generation.
                            style:
                              type: string
                              description: Style of content generation
                            title:
                              type: string
                              description: Title of Generated Content
                            prompt:
                              type: string
                              description: Prompts used during generation
                            duration:
                              type: number
                              description: Duration, measured in seconds
                            stem_set:
                              type: integer
                              minimum: 1
                              description: Candidate group ID to which the `extract_stem` result belongs;
                                the same ID includes the target audio track and its complementary audio
                                track.
                            audio_url:
                              type: string
                              description: The URL of the generated audio file
                            image_url:
                              type: string
                              description: URL of the cover or preview image
                            video_url:
                              type: string
                              description: The URL of the generated video file, if not available, is an
                                empty string.
                            created_at:
                              type: string
                              description: The creation time of this result
                        remainder:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The unique ID of this result
                            lyric:
                              type: string
                              description: Generate lyrics for the content.
                            model:
                              type: string
                              description: Model used for generation
                            state:
                              type: string
                              description: Generate status, for example, `succeeded` indicates successful
                                generation.
                            style:
                              type: string
                              description: Style of content generation
                            title:
                              type: string
                              description: Title of Generated Content
                            prompt:
                              type: string
                              description: Prompts used during generation
                            duration:
                              type: number
                              description: Duration, measured in seconds
                            stem_set:
                              type: integer
                              minimum: 1
                              description: Candidate group ID to which the `extract_stem` result belongs;
                                the same ID includes the target audio track and its complementary audio
                                track.
                            audio_url:
                              type: string
                              description: The URL of the generated audio file
                            image_url:
                              type: string
                              description: URL of the cover or preview image
                            video_url:
                              type: string
                              description: The URL of the generated video file, if not available, is an
                                empty string.
                            created_at:
                              type: string
                              description: The creation time of this result
                        stem_type:
                          enum:
                          - vocals
                          - backing_vocals
                          - drums
                          - bass
                          - guitar
                          - keyboard
                          - percussion
                          - strings
                          - synth
                          - fx
                          - brass
                          - woodwinds
                          type: string
                          description: The audio track types extracted by this group.
                    description: Only `extract_stem` returns. Each item pairs the target audio track with
                      the complementary result after removing that audio track.
          description: Request successful (OK).
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          - application/x-ndjson
          type: string
        required: false
        description: Specify the format of the response returned by the server. If not specified, the
          default format is `application/json`; if `application/x-ndjson` is specified, the response will
          be returned in a JSON format separated by newline characters, streamed back in chunks.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: generateMusic
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bpm:
                  type: integer
                  maximum: 300
                  minimum: 1
                  description: Sound effect target speed (beats per minute), optional only when `action`
                    is `sounds`, must be an integer from 1 to 300.
                key:
                  type: string
                  description: The target mood of the sound effect, optional only when `action` is `sounds`.
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                lyric:
                  type: string
                  description: Lyrics for generating music under custom mode (`custom` is `true`). `chirp-v3-5`
                    and `chirp-v4` have a maximum of 3000 characters; `chirp-v4-5` and above (including
                    `chirp-v5`, `chirp-v5-5`) have a maximum of 5000 characters.
                model:
                  enum:
                  - chirp-v6
                  - chirp-v6-wild
                  - chirp-v6-mini
                  - chirp-v5-5
                  - chirp-v5
                  - chirp-v4-5-plus
                  - chirp-v4-5
                  - chirp-v4
                  - chirp-v3-5
                  - chirp-v3-0
                  type: string
                  description: The model used for generating music has a default value of `chirp-v4`.
                sound:
                  type: string
                  description: The sound effect description to be generated, required when `action` is
                    `sounds`.
                style:
                  type: string
                  description: Music style description. `chirp-v3-5` and `chirp-v4` up to 200 characters;
                    `chirp-v4-5` and above (including `chirp-v5`, `chirp-v5-5`) up to 1000 characters.
                title:
                  type: string
                  description: Music Title (Custom Mode). `chirp-v3-5` and `chirp-v4` up to 80 characters;
                    `chirp-v4-5` and above (including `chirp-v5`, `chirp-v5-5`) up to 100 characters.
                action:
                  enum:
                  - generate
                  - extend
                  - upload_extend
                  - upload_cover
                  - concat
                  - cover
                  - artist_consistency
                  - artist_consistency_vox
                  - stems
                  - all_stems
                  - add_stem
                  - extract_stem
                  - sounds
                  - adjust_speed
                  - replace_section
                  - underpainting
                  - overpainting
                  - remaster
                  - mashup
                  - samples
                  - inspo
                  type: string
                  default: generate
                  description: 'Types of operations for generating music. `generate`: Generate audio based
                    on prompts; `extend`: Continue generating based on existing audio; `concat`: Stitch
                    existing audio clips into a complete track; `cover`: Copy the musical style of an
                    existing track and reinterpret it; `upload_cover`: Style cover of uploaded audio;
                    `upload_extend`: Extend and continue generating uploaded audio; `artist_consistency`:
                    Sing new songs in the style of a specified artist (Persona); `artist_consistency_vox`:
                    Sing new songs in the style of a specified artist using VOX mode; `stems`: Separate
                    the song into vocal and accompaniment tracks; `all_stems`: Separate the song into
                    all independent tracks (vocals, drums, bass, other instruments); `replace_section`:
                    Replace segments within a specified time period; `underpainting`: Generate and add
                    AI accompaniment to the uploaded vocal track; `overpainting`: Generate and add AI
                    vocals to the uploaded accompaniment track; `samples`: Add AI samples to the uploaded
                    audio within a specified time period; `remaster`: Remaster existing audio to enhance
                    sound quality; `mashup`: Mix and stitch multiple songs into one track; `inspo`: Generate
                    new music inspired by 1 to 4 reference audio segments.'
                custom:
                  type: boolean
                  default: false
                  description: Whether to enable the custom mode flag. If `true`, the audio will be generated
                    based on the lyrics; otherwise, it will be generated based on the prompts.
                prompt:
                  type: string
                  description: The prompt words for generating music in inspiration mode (when `custom`
                    is set to `false`) must not exceed 500 characters. For custom mode, please use `lyric`
                    and `style`.
                variety:
                  enum:
                  - 'off'
                  - normal
                  - high
                  - extra
                  - max
                  type: string
                  description: The diversity strength of the generated results, with optional values `off`,
                    `normal`, `high`, `extra`, and `max`. Used for generation actions that support this
                    capability; can be omitted when diversity control is not needed.
                audio_id:
                  type: string
                  description: Audio ID used for generating additional audio based on existing audio.
                    This field is required when `action` is `extend` or `concat`.
                duration:
                  type: integer
                  maximum: 360
                  minimum: 10
                  description: 'The expected song duration (in seconds) must be an integer, with a range
                    of 10 to 360. This is used for song generation in custom mode (`custom` is `true`).
                    It is a preference prompt rather than a strict constraint: the model will refer to
                    this value but does not guarantee to meet it. The actual product duration is based
                    on the `duration` field in the response, which is usually shorter than the expected
                    value, and results from submitting the same request multiple times may also vary significantly.'
                max_mode:
                  type: boolean
                  default: false
                  description: Whether to enable enhanced generation mode. `generate` is only enabled
                    when both `custom` and `max_mode` are `true`, with a cost of 1.12 Credits; `add_stem`
                    can be enabled directly, with a cost of 1.344 Credits. Do not pass in other actions.
                stem_type:
                  enum:
                  - vocals
                  - backing_vocals
                  - drums
                  - bass
                  - guitar
                  - keyboard
                  - percussion
                  - strings
                  - synth
                  - fx
                  - brass
                  - woodwinds
                  type: string
                  description: Track type. Required when `action` is `add_stem` or `extract_stem`; supports
                    `vocals`, `backing_vocals`, `drums`, `bass`, `guitar`, `keyboard`, `percussion`, `strings`,
                    `synth`, `fx`, `brass`, `woodwinds`.
                weirdness:
                  type: number
                  maximum: 1
                  minimum: 0
                  description: The "Weirdness" advanced parameter in the Suno official custom mode has
                    a value range of 0 to 1, with higher values resulting in more creative and experimental
                    outputs. It is only effective in custom mode.
                audio_urls:
                  type: array
                  items:
                    type: string
                    pattern: ^https?://
                  maxItems: 4
                  minItems: 1
                  description: A list of reference audio URLs for inspiration, requiring 1 to 4 publicly
                    accessible audio addresses. This field is mandatory when `action` is `inspo`.
                keep_pitch:
                  type: boolean
                  default: false
                  description: Whether to maintain the original pitch when adjusting speed, required when
                    `action` is `adjust_speed`.
                persona_id:
                  type: string
                  description: Singer-style or cloned-voice Persona ID. For cover / upload_cover, this
                    selects the cover voice. For a private voice, first upload the original song through
                    /suno/upload with the same persona_id, then use the returned audio_id. Voice creation,
                    upload, and cover generation must use the same service channel. No additional vocal_gender
                    is needed.
                sound_type:
                  enum:
                  - one-shot
                  - loop
                  type: string
                  description: Sound effect type, required when `action` is `sounds`. `one-shot` indicates
                    a one-shot sound effect, and `loop` indicates a loopable sound effect.
                continue_at:
                  type: number
                  description: Continue generating from the specified time point (seconds) of the existing
                    audio. For example, 213.5 means to continue from 3 minutes and 33.5 seconds.
                samples_end:
                  type: number
                  description: Add the end time of the sample for the uploaded audio, which must be less
                    than the total duration of the song.
                audio_format:
                  enum:
                  - mp3
                  type: string
                  description: Output audio format, optional only when `action` is `extract_stem` or `sounds`;
                    available options are `mp3`, `m4a`, and `wav`.
                audio_weight:
                  type: number
                  maximum: 1
                  minimum: 0
                  description: The weight of the uploaded reference audio, with a value range from 0 to
                    1, where a higher value indicates greater reliance on the reference audio. This only
                    takes effect during the cover operation.
                callback_url:
                  type: string
                  description: Callback URL to be called after audio generation is complete.
                instrumental:
                  type: boolean
                  description: Pure accompaniment mode (no lyrics), default is `false`. When set to `true`,
                    the lyrics filled in above will be ignored.
                lyric_prompt:
                  type: string
                  description: Prompts for automatically generating lyrics, effective only when `custom`
                    is `true` and `lyric` is empty.
                vocal_gender:
                  enum:
                  - f
                  - m
                  type: string
                  description: Voice gender preference, selectable values are `'m'` (male voice) or `'f'`
                    (female voice). Models `chirp-v4-5` and above are effective; this parameter is a preference
                    item that can increase the probability of the target gender, but it does not guarantee
                    strict adherence.
                negative_tags:
                  type: string
                  description: Descriptions of styles or genres that should not appear in the generated
                    music will only take effect when the custom mode (`custom` is `true`). This API currently
                    sets no fixed character limit for this field; overly long content may still fail to
                    process, so keep it concise.
                samples_start:
                  type: number
                  description: Add a default start time for the uploaded audio sample, with a default
                    value of 0.
                style_influence:
                  type: number
                  maximum: 1
                  minimum: 0
                  description: The "Style Influence" advanced parameter in the Suno official custom mode
                    has a value range of 0 to 1, with higher values being closer to the selected style.
                    It is only effective in custom mode.
                mashup_audio_ids:
                  type: array
                  items:
                    type: string
                  description: Audio ID list for mixing and mashup. This field is required when `action`
                    is `mashup`.
                overpainting_end:
                  type: number
                  description: Add the end time of the AI voice to the uploaded audio, which must be less
                    than the total duration of the song.
                speed_multiplier:
                  type: number
                  maximum: 4
                  minimum: 0.25
                  description: Playback speed multiplier, required when `action` is `adjust_speed`, ranging
                    from 0.25 to 4.
                underpainting_end:
                  type: number
                  description: Add the end time for the AI accompaniment to the uploaded audio, which
                    must be less than the total duration of the song.
                overpainting_start:
                  type: number
                  description: Set the default start time for the AI voice of the uploaded audio to 0.
                variation_category:
                  enum:
                  - high
                  - normal
                  - subtle
                  type: string
                  description: '`variation_category` only supports version v5 and above, with only three
                    optional values: `high`, `normal`, `subtle`.'
                replace_section_end:
                  type: number
                  description: When `action` is `replace_section`, specify the end time (in seconds) of
                    the segment to be replaced.
                underpainting_start:
                  type: number
                  description: Set the default start time for the AI accompaniment added to the uploaded
                    audio, with a default value of 0.
                replace_section_start:
                  type: number
                  description: When `action` is `replace_section`, specify the start time (in seconds)
                    of the segment to be replaced.
                replace_section_result_mode:
                  enum:
                  - candidates
                  - full_song
                  type: string
                  default: full_song
                  description: When `action` is `replace_section`, specify the return format. `full_song`
                    (default) will concatenate 2 candidates separately and return 2 complete songs; `candidates`
                    will return 2 uncombined replacement segment candidates, which need to be selected
                    before calling `concat`.
        required: true
      description: 'Suno AI music generation API, generates 2 songs per request with extension support.
        Full input requirements: https://platform.acedata.cloud/documents/suno-audios Submit once with
        async=true. Retain task_id and poll the matching task tool; a task ID is not a completed result.
        Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/suno-audios
  /suno/voices:
    post:
      summary: Suno Voice Clone API. Create a custom voice persona from an uploaded audio file for voice
        cloning in music generation.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the voice persona is automatically generated by the system.
                          Please refer to this voice persona using persona_id.
                      is_public:
                        type: boolean
                        description: Is the voice persona public? The voice persona created from uploaded
                          audio is always private.
                      persona_id:
                        type: string
                        description: A unique identifier for the created voice persona has been established.
                          When calling the Suno Audios API to generate music, this ID can be used to specify
                          the use of that voice.
                    description: Created voice personality information.
                  success:
                    type: boolean
                    description: A flag indicating whether the request was successful.
                  task_id:
                    type: string
                    description: The unique identifier for this task.
          description: Request successful.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          - application/x-ndjson
          type: string
        required: false
        description: Specify the format of the response returned by the server. If not specified, the
          default format is `application/json`; if specified as `application/x-ndjson`, the response will
          be returned in a chunked streaming format separated by newline characters in JSON format.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: cloneVoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - audio_url
              properties:
                name:
                  type: string
                  description: Custom voice personality name.
                audio_url:
                  type: string
                  description: Publicly accessible URL for audio files used to create sound. Must be in
                    MP3 or WAV format, with a duration between 10 to 240 seconds (recommended 30 to 60
                    seconds), and must contain a clear human voice of a single speaker, without background
                    noise or background music. Complete songs with accompaniment usually cannot pass voiceprint
                    verification.
                description:
                  type: string
                  description: Description information for custom voice personality.
        required: true
      description: 'Suno Voice Clone API. Create a custom voice persona from an uploaded audio file for
        voice cloning in music generation. Full input requirements: https://platform.acedata.cloud/documents/suno-voices'
      externalDocs:
        url: https://platform.acedata.cloud/documents/suno-voices
  /suno/mp3:
    post:
      summary: Get a playable MP3 URL for the existing Suno audio ID.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - file_url
                      properties:
                        file_url:
                          type: string
                          description: Playable audio URL. Usually the `.mp3` address of AceDataCloud
                            CDN; returns the source audio address when the transfer times out or fails.
                    description: The content of the data returned by the API.
                  success:
                    type: boolean
                    description: A boolean flag indicating whether this request was successful.
                  task_id:
                    type: string
                    description: The task ID corresponding to this request.
                  trace_id:
                    type: string
                    description: The tracking ID for this request is used for debugging and link tracing.
                required:
                - task_id
                - trace_id
          description: Synchronous requests return the completion result; asynchronous requests immediately
            return the task and tracking ID.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the format of the server response. If not specified, the default format is
          `application/json`.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: exportMp3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - audio_id
              properties:
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                audio_id:
                  type: string
                  description: Existing audio ID used to obtain the MP3 URL.
                callback_url:
                  type: string
                  description: Callback URL for receiving processing results. If not specified, the results
                    will be returned directly in the response body.
        required: true
      description: 'Get a playable MP3 URL for the existing Suno audio ID. Full input requirements: https://platform.acedata.cloud/documents/suno-mp3
        Submit once with async=true. Retain task_id and poll the matching task tool; a task ID is not
        a completed result. Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/suno-mp3
  /suno/upload:
    post:
      summary: Suno reference audio upload API, upload audio to get an audio_id for extended generation.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      audio_id:
                        type: string
                      audio_url:
                        type: string
                      image_url:
                        type: string
                      image_large_url:
                        type: string
                      title:
                        type: string
                      lyric:
                        type: string
                      style:
                        type: string
                      duration:
                        type: number
                  success:
                    type: boolean
                    description: A boolean flag indicating whether this request was successful.
                  task_id:
                    type: string
                    description: Platform task ID, can be queried through the Suno Tasks API.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
                required:
                - task_id
          description: Request successful.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          - application/x-ndjson
          type: string
        required: false
        description: Specify the format of the response returned by the server. If not specified, the
          default format is `application/json`; if specified as `application/x-ndjson`, the response will
          be returned in a block-streaming format of JSON separated by newline characters.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: uploadAudio
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - audio_url
              properties:
                mode:
                  enum:
                  - standard
                  - enhanced
                  type: string
                  default: standard
                  description: Upload mode. `standard` is for regular uploads and maintains the original
                    behavior; `enhanced` is used for authorized audio that cannot be processed by some
                    regular uploads, executed asynchronously by default, and successfully processing consumes
                    1.87 Credits (approximately ¥1.20 per time based on the maximum package).
                name:
                  type: string
                  maxLength: 100
                  minLength: 1
                  description: Audio name. Required when `mode=enhanced`, with a length of 1 to 100 characters.
                audio_url:
                  type: string
                  description: The CDN address (URL) for the custom audio file to be uploaded.
                callback_url:
                  type: string
                  format: uri
                  description: Optional HTTPS callback address. The result will be sent to this address
                    after the upload is completed or fails.
                persona_id:
                  type: string
                  minLength: 1
                  description: Optional voice Persona ID, supported only with mode=standard, not mode=enhanced.
