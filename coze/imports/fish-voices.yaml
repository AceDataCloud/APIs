openapi: 3.0.1
info:
  title: Fish
  version: 2.0.0
  description: 'Turn text into speech, browse supported saved voices, or create a voice from authorized
    reference audio. Retrieve asynchronous speech tasks. Bind your own Ace Data Cloud credential privately
    as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never place a token in
    chat or shared examples. Start: https://platform.acedata.cloud/services/caf99abc-ddcf-4714-b2a5-862d9b469509?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /fish/model:
    get:
      summary: Fish Audio model listing API — paginate through the available voice models.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        state:
                          type: string
                        type:
                          type: string
                        visibility:
                          type: string
                        licensed:
                          type: boolean
                        languages:
                          type: array
                          items:
                            type: string
                        tags:
                          type: array
                          items:
                            type: string
                    description: The list of timbre model entries returned by the current page.
                  total:
                    type: integer
                    description: The total number of tone models that meet the query conditions.
                  max_offset:
                    type: number
                  accessible_upper_bound:
                    type: number
                  window_limited:
                    type: boolean
                  total_is_exact:
                    type: boolean
                  has_more:
                    type: boolean
          description: Request successful.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Response error message.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    anyOf:
                    - type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    - type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Response error message.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '403':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '429':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Too many requests, rate limit exceeded.
        '500':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
