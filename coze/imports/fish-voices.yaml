                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Internal server error, an exception occurred on the server.
      parameters:
      - in: query
        name: page_size
        schema:
          type: integer
          default: 10
        required: false
        description: The number of entries returned per page is 10 by default.
      - in: query
        name: page_number
        schema:
          type: integer
          default: 1
        required: false
        description: Page numbers start from 1, defaulting to 1.
      - in: query
        name: title
        schema:
          type: string
        required: false
        description: Fuzzy filtering based on title keywords.
      - in: query
        name: tag
        schema:
          type: string
        required: false
        description: Filter by individual tags.
      - in: query
        name: self
        schema:
          type: boolean
        required: false
        description: When `true`, only return the models owned by the current calling account.
      - in: query
        name: author_id
        schema:
          type: string
        required: false
        description: Filter by author ID.
      - in: query
        name: language
        schema:
          type: string
        required: false
        description: Filter by language code (e.g., `en`, `zh`).
      - in: query
        name: title_language
        schema:
          type: string
        required: false
        description: Filter according to the language used in the title.
      - in: query
        name: sort_by
        schema:
          type: string
        required: false
        description: Sorting fields (for example, `created_at`, `task_count`).
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: listVoices
      description: 'Fish Audio model listing API — paginate through the available voice models. Full input
        requirements: https://platform.acedata.cloud/documents/fish-model-query'
      externalDocs:
        url: https://platform.acedata.cloud/documents/fish-model-query
