openapi: 3.0.1
info:
  title: GPT Image
  version: 2.0.0
  description: 'Generate and edit images with GPT Image models, then retrieve completed image results.
    Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization. Usage
    is billed to your account. Never place a token in chat or shared examples. Start: https://platform.acedata.cloud/services/06f2acb7-e4d4-43de-9909-76e27b4e2355?from=coze&utm_source=coze&utm_medium=referral&utm_campaign=evergreen&utm_content=coze_gpt-image_setup'
servers:
- url: https://api.acedata.cloud
paths:
  /openai/images/generations:
    post:
      summary: Unified image generation endpoint compatible with the OpenAI Images API. A single endpoint
        supports DALL·E 2/3, the full GPT Image family (gpt-image-1, gpt-imag
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  task_id:
                    type: string
                  success:
                    type: boolean
          description: Image generation successful or operation executed successfully.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: generateImage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prompt
              - model
              properties:
                n:
                  type: integer
                  default: 1
                  maximum: 10
                  minimum: 1
                  description: 'The number of images to be generated ranges from 1 to 10. `dall-e-3` is
                    fixed at `1`. The `dall-e-2`, `gpt-image-1` / `gpt-image-1.5` / `gpt-image-2` series,
                    as well as the `nano-banana` / `nano-banana-2-lite` / `nano-banana-2` / `nano-banana-pro`
                    series all support `n>1`: they will return and charge for the corresponding number
                    of images. Note that `response_format=b64_json` only supports `n=1`, and for `n>1`,
                    please use the default URL return. If some images fail to generate, only the successful
                    parts will be returned and charged.'
                size:
                  type: string
                  default: auto
                  pattern: ^(auto|\d+x\d+)$
                  nullable: true
                  description: 'The size of the generated image is in the format `width x height`, or
                    fill in `auto` to select the aspect ratio based on the prompt semantics. **`gpt-image-2`**
                    accepts any `WIDTHxHEIGHT` value that conforms to the format, including 1K presets
                    (`1024x1024`, `1536x1024`, `1024x1536`, `1792x1024`, `1024x1792`), 2K presets (`2048x2048`,
                    `2048x1536`, `1536x2048`, `2048x1152`, `1152x2048`), 4K presets (`2880x2880`, `3264x2448`,
                    `2448x3264`, `3840x2160`, `2160x3840`), and any custom size; regardless of the size,
                    each image is billed uniformly. Size restrictions: custom sizes must be multiples
                    of 16, with the longer side not exceeding 3840, and total pixels not exceeding 8,294,400.
                    `dall-e-2` supports: `256x256`, `512x512`, `1024x1024`. `dall-e-3` supports: `1024x1024`,
                    `1792x1024`, `1024x1792`. When explicitly passing `auto`, the platform will determine
                    based on clear pixels or ratios, naming standards (paper / print / platform ad / advertisement
                    / device / photography / film), medium conventions, and composition in a sequential
                    manner. In addition to common ratios, it can also retain non-standard ratios such
                    as `1.91:1`, `1.85:1`, `2.39:1`, ISO paper `1:√2`, etc.; the result will be normalized
                    to the service-supported multiples of 16 and pixel budget. If automatic judgment is
                    unavailable, it will fall back to the model''s default aspect ratio. Omitting the
                    `size` field will directly use the model''s default aspect ratio. If there are strict
                    pixel requirements, please directly pass `WIDTHxHEIGHT`.'
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                model:
                  enum:
                  - gpt-image-1
                  - gpt-image-1.5
                  - gpt-image-2
                  - gpt-image-2.5-flare
                  - gpt-image-2.5-flare:official
                  - gpt-image-2.5-sunburst
                  - gpt-image-2.5-sunburst:official
                  - gpt-image-2:official
                  type: string
                  description: Select a supported GPT Image model explicitly. Model-specific parameters
                    and prices apply; no automatic model substitution.
                  default: gpt-image-2
                style:
                  enum:
                  - vivid
                  - natural
                  type: string
                  default: vivid
                  description: 'The style of `dall-e-3`: `vivid` (hyper-realistic/dramatic) or `natural`
                    (more naturally neutral).'
                prompt:
                  enum:
                  - A cute baby sea otter
                  - 'A wooden bookshelf consisting of three shelves: on the top shelf one book, the second
                    shelf three books, and the bottom shelf seven books.'
                  - Cinematic minimal portrait of a solitary man standing in an intense orange-to-red
                    gradient environment, strong silhouette lighting, deep shadow contrast, reflective
                    glossy floor, symmetrical composition.
                  - Symmetrical design featuring two elegant blue peacocks with detailed feather patterns,
                    surrounded by blue floral elements, intricate vintage botanical ornament, soft beige
                    background, decorative art illustration.
                  - Avant-garde sports fashion advertisement, oversized basketball posed like a monumental
                    sculpture, female athlete reclining across the ball's curved surface, giant word 'ELEVATE'
                    in bold typography behind, burnt orange studio backdrop, glossy reflective floor.
                  - High-fashion surrealist poster for Rolex. Deep emerald green minimalist studio with
                    polished reflective floor. A massive Rolex watch standing upright like a monument;
                    a male model in tailored dark green suit leans casually against the watch face, wearing
                    a matching Rolex.
                  - Ultra-realistic product photography of a rich strawberry soft-serve ice cream in a
                    crispy waffle cone, clean modern premium aesthetic, soft serve vibrant natural pink,
                    sculpted swirl with curled peak, lightly topped with strawberry dust.
                  - Hyper-realistic UI/UX mockup on a slim modern laptop on a minimal wooden desk with
                    soft natural daylight; clean SaaS dashboard with elegant typography, glassmorphism
                    cards, smooth gradients, subtle drop shadows, charts, sidebar navigation, macOS-style
                    window frame.
                  - 9:16 vertical Korean idol portrait photoshoot, 3x3 grid (nine frames), same person
                    in all images, consistent facial features and styling, soft black mist filter effect,
                    lowered contrast, blooming highlights, subtle glow around light sources.
                  - Mobile phone photo, old CCD camera aesthetic, harsh flash, grainy, dim messy indoor
                    lighting, candid snapshot feeling, slight motion blur.
                  - Create a science fiction movie poster.
                  - 以中国连环画（小人书）的风格帮我绘制大闹天宫
                  - 新中式水墨山水海报，竖版9:16构图，东方极简美学风格，大面积留白，主题是春岚一叶红
                  type: string
                  description: 'Text description of the required image. The GPT image model supports up
                    to 32,000 characters, `dall-e-2` supports up to 1,000 characters, and `dall-e-3` supports
                    up to 4,000 characters. A selection of example prompts is provided in the dropdown
                    list (source: [EvoLinkAI/awesome-gpt-image-2-prompts](https://github.com/EvoLinkAI/awesome-gpt-image-2-prompts),
                    Apache-2.0 license); you can also enter your own.'
                quality:
                  enum:
                  - auto
                  - high
                  - medium
                  - low
                  - hd
                  - standard
                  type: string
                  default: auto
                  description: 'Image quality. GPT image model options: `auto` (default), `high`, `medium`,
                    `low`. `dall-e-3` options: `hd` or `standard`. `dall-e-2` supports only: `standard`.'
                background:
                  enum:
                  - transparent
                  - opaque
                  - auto
                  type: string
                  default: auto
                  description: Set the background opacity for the GPT image model. The optional values
                    are `transparent`, `opaque`, or `auto` (default). When selecting `transparent`, please
                    use an output format that supports the Alpha channel (png/webp).
                moderation:
                  enum:
                  - low
                  - auto
                  type: string
                  default: auto
                  description: The content review levels of the GPT image model. `low` will relax the
                    filtering strength; `auto` uses the default policy.
                callback_url:
                  type: string
                  description: Optional callback URL. Once provided, the API will immediately return `task_id`
                    and will push the results to that URL via a POST request after the image generation
                    is complete. The callback payload contains `task_id`, `trace_id`, `success` (boolean),
                    and the complete response data or error information.
                output_format:
                  enum:
                  - png
                  - jpeg
                  - webp
                  type: string
                  default: png
                  description: The return format of the GPT image model. Optional values are `png`, `jpeg`,
                    or `webp`.
                partial_images:
                  type: integer
                  default: 0
                  maximum: 3
                  minimum: 0
                  description: The number of intermediate images sent during the streaming process (0-3).
                    `0` indicates that the final image is returned directly in one event.
                response_format:
                  enum:
                  - url
                  - b64_json
                  type: string
                  default: url
                  nullable: true
                  description: 'The return format for `dall-e-2` / `dall-e-3` images: `url` or `b64_json`.
                    The GPT image model does not support this parameter (always returns base64 encoded).'
                output_compression:
                  type: integer
                  default: 100
                  maximum: 100
                  minimum: 0
                  description: The compression level (0-100%) of the GPT image model when using `webp`
                    or `jpeg` output formats.
        required: true
      description: 'Unified image generation endpoint compatible with the OpenAI Images API. A single
        endpoint supports DALL·E 2/3, the full GPT Image family (gpt-image-1, gpt-imag Full input requirements:
        https://platform.acedata.cloud/documents/openai-images-generations Submit once with async=true.
        Retain task_id and poll the matching task tool; a task ID is not a completed result. Do not resubmit
        while pending. This Coze form uses explicit parameter types. Model/action requirements in the
        linked API guide still apply.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/openai-images-generations
  /openai/tasks:
    post:
      summary: Query tasks created by /v1/images/generations or /v1/images/edits with callback_url.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Task ID.
                  type:
                    type: string
                    description: Task type.
                  api_id:
                    type: string
                    description: API Identifier.
                  elapsed:
                    type: number
                    format: double
                    minimum: 0
                    nullable: true
                    description: Processing duration (seconds).
                  user_id:
                    type: string
                    nullable: true
                    description: The account to which the task belongs.
                  trace_id:
                    type: string
                    description: Request tracking ID.
                  created_at:
                    type: number
                    format: double
                    description: Task creation time, Unix timestamp (seconds).
                  started_at:
                    type: number
                    format: double
                    description: Process start time, Unix timestamp (seconds).
                  finished_at:
                    type: number
                    format: double
                    nullable: true
                    description: Processing completion time, Unix timestamp (seconds).
                  actor_user_id:
                    type: string
                    nullable: true
                    description: Account for executing the authorization request.
                  credential_id:
                    type: string
                    nullable: true
                    description: Credentials used to start tasks.
                  application_id:
                    type: string
                    description: Application for billing.
                  authorization_id:
                    type: string
                    nullable: true
                    description: Authorization used when starting the task.
                  count:
                    type: integer
                    minimum: 0
                    description: Total number of matching tasks.
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - created_at
                      - trace_id
                      properties:
                        id:
                          type: string
                          description: Task ID.
                        type:
                          type: string
                          description: Task type.
                        api_id:
                          type: string
                          description: API Identifier.
                        elapsed:
                          type: number
                          format: double
                          minimum: 0
                          nullable: true
                          description: Processing duration (seconds).
                        user_id:
                          type: string
                          nullable: true
                          description: The account to which the task belongs.
                        trace_id:
                          type: string
                          description: Request tracking ID.
                        created_at:
                          type: number
                          format: double
                          description: Task creation time, Unix timestamp (seconds).
                        started_at:
                          type: number
                          format: double
                          description: Process start time, Unix timestamp (seconds).
                        finished_at:
                          type: number
                          format: double
                          nullable: true
                          description: Processing completion time, Unix timestamp (seconds).
                        actor_user_id:
                          type: string
                          nullable: true
                          description: Account for executing the authorization request.
                        credential_id:
                          type: string
                          nullable: true
                          description: Credentials used to start tasks.
                        application_id:
                          type: string
                          description: Application for billing.
                        authorization_id:
                          type: string
                          nullable: true
                          description: Authorization used when starting the task.
                        response:
                          type: object
                          description: Create the final response recorded for the API operation of this
                            task; the fields follow the structure of the success or error response in
                            the operation documentation.
                          properties:
                            success:
                              type: boolean
                            task_id:
                              type: string
                            trace_id:
                              type: string
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  url:
                                    type: string
                                  b64_json:
                                    type: string
                                  revised_prompt:
                                    type: string
                            cost:
                              type: object
                              properties:
                                amount:
                                  type: number
                                list_amount:
                                  type: number
                                currency:
                                  type: string
                            model:
                              type: string
                            created:
                              type: number
                            error:
                              type: object
                              properties:
                                code:
                                  type: string
                                message:
                                  type: string
                    description: Matching task list.
                  has_more:
                    type: boolean
                    description: Is there another page of tasks?
                  count_is_exact:
                    type: boolean
                    description: Whether `count` is the exact total.
                  count_relation:
                    enum:
                    - eq
                    - gte
                    type: string
                    description: 'The relationship between `count` and the actual total: `eq` indicates
                      equality, and `gte` indicates that the actual total is greater than or equal to
                      that value.'
                  response:
                    type: object
                    description: Create the final response recorded for the API operation of this task;
                      the fields follow the structure of the success or error response in the operation
                      documentation.
                    properties:
                      success:
                        type: boolean
                      task_id:
                        type: string
                      trace_id:
                        type: string
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                            b64_json:
                              type: string
                            revised_prompt:
                              type: string
                      cost:
                        type: object
                        properties:
                          amount:
                            type: number
                          list_amount:
                            type: number
                          currency:
                            type: string
                      model:
                        type: string
                      created:
                        type: number
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                          message:
                            type: string
          description: Operation executed successfully.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: getTaskResults
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Task ID (returned in the original response). Used by `retrieve`.
                ids:
                  type: array
                  items:
                    type: string
                  description: Task ID list. Used by `retrieve_batch`.
                type:
                  enum:
                  - images
                  - images_generations
                  - images_edits
                  type: string
                  description: Filter by task type. The same model may produce different task types depending
                    on the actual processing path taken for this request, so it is not recommended to
                    rely on the correspondence between type and model; omitting this field will return
                    all types. Used by `retrieve_batch`.
                limit:
                  type: integer
                  default: 12
                  description: Page size. Used by `retrieve_batch`.
                action:
                  enum:
                  - retrieve
                  - retrieve_batch
                  type: string
                  default: retrieve
                  description: Operation type. Use `retrieve` to query a single task, and use `retrieve_batch`
                    to list tasks in bulk.
                offset:
                  type: integer
                  default: 0
                  description: Pagination offset. Used by `retrieve_batch`.
                user_id:
                  type: string
                  description: Filter tasks by `user_id`. Used by `retrieve_batch`.
                trace_id:
                  type: string
                  description: The tracking ID of the original request. Used by `retrieve`.
                trace_ids:
                  type: array
                  items:
                    type: string
                  description: Tracking ID list. Used by `retrieve_batch`.
                count_mode:
                  enum:
                  - none
                  - exact
                  type: string
                  default: none
                  description: Counting mode. By default, `none` does not perform a full count and returns
                    a provable quantity through pagination metadata; `exact` attempts to count the exact
                    total within 2 seconds, and automatically degrades to a lower bound after timeout.
                    Used by `retrieve_batch`.
                application_id:
                  type: string
                  description: Filter tasks by `application_id`. Used by `retrieve_batch`.
                created_at_max:
                  type: number
                  description: Filter tasks created before this Unix timestamp (seconds). Used by `retrieve_batch`.
                created_at_min:
                  type: number
                  description: Filter tasks created after this Unix timestamp (seconds). Used by `retrieve_batch`.
        required: true
      description: 'Query tasks created by /v1/images/generations or /v1/images/edits with callback_url.
        Full input requirements: https://platform.acedata.cloud/documents/openai-tasks A non-null response
        can be a progress snapshot. Require terminal success and a non-empty primary media URL or content,
        not just a cover image or an empty data array. This Coze form uses explicit parameter types. Model/action
        requirements in the linked API guide still apply.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/openai-tasks
  /openai/images/edits:
    post:
      summary: OpenAI image editing API, input images and instructions, output modified images.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  task_id:
                    type: string
                  success:
                    type: boolean
          description: Image generation successful or operation executed successfully.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format, only supporting `application/json`.
      - in: header
        name: Content-Type
        schema:
          enum:
          - multipart/form-data
          - application/json
          type: string
        required: true
        description: Use `multipart/form-data` to upload image files, or use `application/json` to reference
          images via URL (extended mode; JSON mode does not support direct upload of file bytes).
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: editImage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              - prompt
              properties:
                n:
                  type: integer
                  default: 1
                  maximum: 10
                  minimum: 1
                  description: 'Number of images to generate (1-10). `dall-e-3` is fixed at `1`. The `dall-e-2`,
                    `gpt-image-1` / `gpt-image-1.5` / `gpt-image-2` series, as well as the `nano-banana`
                    / `nano-banana-2-lite` / `nano-banana-2` / `nano-banana-pro` series all support `n>1`:
                    they will return and charge for the corresponding number of edited results. Note that
                    `response_format=b64_json` only supports `n=1`, for `n>1` please use the default URL
                    return. If some images fail to generate, only the successful parts will be returned
                    and charged.'
                size:
                  type: string
                  default: auto
                  pattern: ^(auto|\d+x\d+)$
                  nullable: true
                  description: 'Image size, in the format of `WIDTHxHEIGHT`, or `auto`. **`gpt-image-2`**
                    accepts any `WIDTHxHEIGHT` value that conforms to this format, including 1K presets
                    (`1024x1024`, `1536x1024`, `1024x1536`, `1792x1024`, `1024x1792`), 2K presets (`2048x2048`,
                    `2048x1536`, `1536x2048`, `2048x1152`, `1152x2048`), 4K presets (`2880x2880`, `3264x2448`,
                    `2448x3264`, `3840x2160`, `2160x3840`), and custom sizes; regardless of the size,
                    each image is billed at a fixed price. Size limitations: custom sizes must be multiples
                    of 16, with the long side ≤ 3840, and total pixel count ≤ 8,294,400. `dall-e-2` supports:
                    `256x256`, `512x512`, `1024x1024`. When passing `auto` (default) or leaving it blank,
                    the output will maintain the aspect ratio of the reference image; if the aspect ratio
                    needs to be changed, `WIDTHxHEIGHT` must be explicitly specified.'
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                image:
                  description: Reference image URL. Accepts a single URL string or an array of URL strings
                    (up to 16 for the GPT Image series models, `dall-e-2` supports only 1). The JSON mode
                    **does not** accept uploaded file bytes—if you need to upload files directly, please
                    use `multipart/form-data`.
                  type: array
                  items:
                    type: string
                    format: uri
                model:
                  enum:
                  - gpt-image-1
                  - gpt-image-1.5
                  - gpt-image-2
                  - gpt-image-2.5-flare
                  - gpt-image-2.5-flare:official
                  - gpt-image-2.5-sunburst
                  - gpt-image-2.5-sunburst:official
                  - gpt-image-2:official
                  type: string
                  default: gpt-image-2
                  description: Select a supported GPT Image model explicitly. Model-specific parameters
                    and prices apply; no automatic model substitution.
                prompt:
                  type: string
                  description: Describe the text of the desired editing effect. `dall-e-2` up to 1000
                    characters, GPT Image series models up to 32000 characters.
                quality:
                  enum:
                  - auto
                  - high
                  - medium
                  - low
                  - standard
                  type: string
                  default: auto
                  description: 'Image quality. The GPT Image series models support: `auto`, `high`, `medium`,
                    `low`.'
                background:
                  enum:
                  - transparent
                  - opaque
                  - auto
                  type: string
                  default: auto
                  description: 'Only applicable to the GPT Image series models. Transparency handling
                    methods: `transparent` (transparent), `opaque` (opaque), or `auto` (automatic).'
                callback_url:
                  type: string
                  description: Optional callback URL. When provided, the interface immediately returns
                    `task_id` and pushes the results to that URL via POST after the image editing is completed.
                output_format:
                  enum:
                  - png
                  - jpeg
                  - webp
                  type: string
                  default: png
                  description: 'The return formats of the GPT Image series models are: `png`, `jpeg`,
                    or `webp`.'
                input_fidelity:
                  enum:
                  - high
                  - low
                  type: string
                  description: Matching strength of style and features of the input image (applicable
                    to GPT Image series models).
                response_format:
                  enum:
                  - url
                  - b64_json
                  type: string
                  default: url
                  nullable: true
                  description: 'Response format: `url` (default) or `b64_json`.'
                output_compression:
                  type: integer
                  default: 100
                  maximum: 100
                  minimum: 0
                  description: Compression level (0-100%) when outputting `webp` or `jpeg`.
        required: true
      description: 'OpenAI image editing API, input images and instructions, output modified images. Full
        input requirements: https://platform.acedata.cloud/documents/openai-images-edits Submit once with
        async=true. Retain task_id and poll the matching task tool; a task ID is not a completed result.
        Do not resubmit while pending. This Coze form uses explicit parameter types. Model/action requirements
        in the linked API guide still apply. Coze form limitations: some union inputs use one representation
        and optional opaque objects are omitted; see compatibility notes. Text-message content is supported
        where the form uses string.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/openai-images-edits
