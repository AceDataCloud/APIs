      operationId: post__hailuo_videos
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                model:
                  enum:
                  - minimax-i2v
                  - minimax-t2v
                  - minimax-i2v-director
                  type: string
                  description: The model used for generating videos has a default value of `minimax-t2v`.
                action:
                  enum:
                  - generate
                  type: string
                  description: The operation type for video generation. When set to `generate`, it will
                    generate a video based on the prompt.
                prompt:
                  type: string
                  description: Prompts for generating videos.
                callback_url:
                  type: string
                  description: The callback URL that will be called after the video generation is complete.
                first_image_url:
                  type: string
                  description: You can specify the URL of the first frame image to generate a video from
                    the image.
        required: true
      description: 'Minimax Hailuo AI video generation API. Supports minimax-t2v for text-to-video, minimax-i2v
        for image-to-video, and minimax-i2v-director for director mode with Full input requirements: https://platform.acedata.cloud/documents/hailuo-videos-integration
        Submit once with async=true. Retain task_id and poll the matching task tool; a task ID is not
        a completed result. Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/hailuo-videos-integration
