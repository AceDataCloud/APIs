                  type: string
                  description: The Hailuo task ID to be queried.
                ids:
                  type: array
                  items:
                    type: string
                  description: A list of Hailuo task IDs for batch querying.
                action:
                  enum:
                  - retrieve
                  - retrieve_batch
                  type: string
                  default: retrieve
                  description: Operation type. Use `retrieve` to query a single task, and use `retrieve_batch`
