  /hailuo/videos:
    post:
      summary: 'Minimax Hailuo AI video generation API. Supports minimax-t2v for text-to-video, minimax-i2v
        for image-to-video, and minimax-i2v-director for director mode with '
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for generating a video.
                        model:
                          type: string
                          description: The model used for generating this video.
                        state:
                          type: string
                        prompt:
                          type: string
                          description: The prompt words used for generating this video.
                        status:
                          type: string
                          description: The status of the video generation task.
                        video_url:
                          type: string
                          description: Generate the URL for the video file.
                        first_image_url:
                          type: string
                          nullable: true
                          description: URL of the reference image for the first frame (if provided).
                    description: Generated video entry list.
                  success:
                    type: boolean
                    description: Was the request successful?
                  task_id:
                    type: string
                    description: Used to track the task ID of this generation request.
                  trace_id:
                    type: string
