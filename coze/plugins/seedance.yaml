                  - trace_id
                  - request
                  properties:
                    id:
                      type: string
                      description: Task ID.
                    type:
                      type: string
                      description: Task type.
                    api_id:
                      type: string
                      description: API Identifier.
                    elapsed:
                      type: number
                      format: double
                      minimum: 0
                      nullable: true
                      description: Processing duration (seconds).
                    request:
                      type: object
                      description: Create the request body recorded for the API operation of this task;
                        the fields depend on the specific operation and action.
                      additionalProperties: true
                    user_id:
                      type: string
                      description: The account to which the task belongs.
                    response:
                      type: object
                      description: Create the final response recorded for the API operation of this task;
                        the fields follow the structure of successful or error responses in the operation
                        documentation.
                      additionalProperties: true
                    trace_id:
                      type: string
                      description: Request tracking ID.
                    created_at:
                      type: number
                      format: double
                      description: Task creation time, Unix timestamp (seconds).
                    started_at:
                      type: number
                      format: double
                      description: Process start time, Unix timestamp (seconds).
                    finished_at:
                      type: number
                      format: double
                      nullable: true
                      description: Processing completion time, Unix timestamp (seconds).
                    actor_user_id:
                      type: string
                      nullable: true
                      description: Account for executing the authorization request.
                    credential_id:
                      type: string
                      nullable: true
                      description: Credentials used to start tasks.
                    application_id:
                      type: string
                      description: Application for billing.
                    authorization_id:
                      type: string
                      nullable: true
                      description: Authorization used when starting the task.
                - type: object
                  required:
                  - items
                  - count
