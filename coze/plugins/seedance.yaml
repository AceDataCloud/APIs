openapi: 3.0.1
info:
  title: AceData_Seedance_Video
  version: 2.0.0
  description: 'Create videos with Seedance from text and supported image, audio or video references.
    Select model-specific duration and output options, then retrieve the task. Bind your own Ace Data
    Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account.
    Never place a token in chat or shared examples. Start: https://platform.acedata.cloud/?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /seedance/videos:
    post:
      summary: ByteDance Seedance video generation API. Supports doubao-seedance-1-0-pro-250528, doubao-seedance-1-0-pro-fast-251015,
        doubao-seedance-1-5-pro-251215, doubao-se
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generate or edit a list of video entries based on the prompts.
                    additionalProperties: true
                  success:
                    type: boolean
                    description: Flag indicating whether this request was successful.
                  task_id:
                    type: string
                    description: The task ID for this request
                  trace_id:
                    type: string
                    description: The tracking ID for this request
          description: Request successful (OK).
