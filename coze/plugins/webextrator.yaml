openapi: 3.0.1
info:
  title: Web Extractor
  version: 2.0.0
  description: 'Render a public web page or extract its content with WebExtrator. Retrieve asynchronous
    tasks and inspect the actual output before using it. Bind your own Ace Data Cloud credential privately
    as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never place a token in
    chat or shared examples. Start: https://platform.acedata.cloud/services/38bebded-b12d-4c1c-9a91-cdaccdd71745?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /webextrator/render:
    post:
      summary: Render a web page at the given URL and return its full HTML, final URL, title, and status
        code.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: Generated link address
                      html:
                        type: string
                        description: HTML source code of the page
                      kind:
                        type: string
                        description: Type of result
                      text:
                        type: string
                        description: Generated text content
                      title:
                        type: string
                        description: Title of Generated Content
                      status:
                        type: integer
                        description: HTTP status codes for page responses
                      finalUrl:
                        type: string
                        description: The final URL accessed after redirection
                      elapsedMs:
                        type: integer
                        description: Processing time, in milliseconds
                      userAgent:
                        type: string
                        description: User-Agent used for the request
                    description: The result data returned from this request
                  elapsed:
                    type: number
                    description: Task processing time, unit is seconds
                  success:
                    type: boolean
                    description: A flag indicating whether this request was successful.
                  task_id:
                    type: string
                    description: The unique ID of this task, which can be used to obtain the processing
                      results of the asynchronous task through the corresponding task query interface.
                  trace_id:
                    type: string
                    description: The tracking ID for this request, used for issue troubleshooting.
                  started_at:
                    type: number
                    description: The time when the task starts processing
                  finished_at:
                    type: number
                    description: Time for task completion processing
          description: Render successful response.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Invalid request - the request body parameters are incorrect.
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: The backend queue is busy, please try again later, or use `callback_url` for asynchronous
            processing.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Internal server error.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: renderPage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: The URL of the webpage to be rendered.
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                delay:
                  type: number
                  description: The additional seconds to wait after the page has finished loading and
                    before capturing the HTML.
                headers:
                  type: object
                  description: Additional HTTP request headers sent along with the page request.
                  additionalProperties:
                    type: string
                timeout:
                  type: number
                  default: 30
                  description: The total timeout for rendering operations, in seconds.
                user_agent:
                  type: string
                  description: Override the default `User-Agent` request header.
                wait_until:
                  enum:
                  - load
                  - domcontentloaded
                  - networkidle
                  - commit
                  type: string
                  default: networkidle
                  description: 'Waiting conditions for page loading. Optional values: `load` (page load
                    complete), `domcontentloaded` (DOM parsing complete), `networkidle` (network idle),
                    `commit` (continue as soon as a response is received). The default value is `networkidle`.'
                callback_url:
                  type: string
                  format: uri
                  description: If this parameter is provided, the request will be processed asynchronously,
                    and the final result will be pushed to this URL via a POST request.
                block_resources:
                  type: array
                  items:
                    enum:
                    - image
                    - font
                    - media
                    - stylesheet
                    - xhr
                    - fetch
                    type: string
                  description: 'Resource types to be intercepted when the page loads, in order to speed
                    up rendering. Optional values: `image`, `font`, `media`, `stylesheet`, `xhr`, `fetch`.'
                wait_for_selector:
                  type: string
                  description: Wait for the CSS selector to appear before capturing HTML.
        required: true
      description: 'Render a web page at the given URL and return its full HTML, final URL, title, and
        status code. Full input requirements: https://platform.acedata.cloud/documents/webextrator-render
        Submit once with async=true. Retain task_id and poll the matching task tool; a task ID is not
        a completed result. Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/webextrator-render
  /webextrator/extract:
    post:
      summary: Extract structured content (title, body, images, product fields) from the given URL, with
        automatic page type detection.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: Generated link address
                      kind:
                        type: string
                        description: Type of result
                      links:
                        type: array
                        items:
                          type: string
                        description: Extracted list of links
                      title:
                        type: string
                        description: Title of Generated Content
                      byline:
                        type: string
                        description: Author's signature of the article
                      images:
                        type: array
                        items:
                          type: string
                        description: Extracted image list
                      markdown:
                        type: string
                        description: Content represented in Markdown format.
                      siteName:
                        type: string
                        description: Source website name
                      structured:
                        type: object
                        properties:
                          brand:
                            type: string
                            description: Brand
                          price:
                            type: number
                            description: Product Price
                          rating:
                            type: number
                            description: Product Rating
                          currency:
                            type: string
                            description: Currency Type
                        description: Structured analysis content
                      contentType:
                        type: string
                        description: Types of content, such as `product`, `article`, `general`
                      description:
                        type: string
                        description: Description of the content information
                    description: The result data returned from this request
                  elapsed:
                    type: number
                    description: Task processing time, unit is seconds
                  success:
                    type: boolean
                    description: A flag indicating whether this request was successful.
                  task_id:
                    type: string
                    description: The unique ID of this task, which can be used to obtain the processing
                      results of the asynchronous task through the corresponding task query interface.
                  trace_id:
                    type: string
                    description: The tracking ID for this request, used for issue troubleshooting.
                  started_at:
                    type: number
                    description: The time when the task starts processing
                  finished_at:
                    type: number
                    description: Time for task completion processing
          description: Extracted successful response.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Invalid request - request body parameter error.
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: The backend queue is busy, please try again later, or use `callback_url` for asynchronous
            processing.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Internal server error.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: extractPage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: Need to extract the URL of the webpage content.
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                delay:
                  type: number
                  description: 'Additional waiting time before starting extraction after the page has
                    finished loading (unit: seconds).'
                headers:
                  type: object
                  description: Additional HTTP request headers sent along with the page request.
                  additionalProperties:
                    type: string
                timeout:
                  type: number
                  default: 30
                  description: 'The total timeout for the extraction operation (unit: seconds).'
                enable_llm:
                  type: boolean
                  default: false
                  description: Whether to enable optional LLM-based semantic normalization processing
                    at the final stage of the extraction process.
                user_agent:
                  type: string
                  description: Override the default `User-Agent` request header.
                wait_until:
                  enum:
                  - load
                  - domcontentloaded
                  - networkidle
                  - commit
                  type: string
                  default: networkidle
                  description: Waiting conditions for page loading.
                callback_url:
                  type: string
                  format: uri
                  description: If this parameter is provided, the request will be processed asynchronously,
                    and the final result will be sent to this URL via a POST request.
                expected_type:
                  enum:
                  - product
                  - article
                  - general
                  type: string
                  description: Indicate the expected page type to optimize extraction results.
                block_resources:
                  type: array
                  items:
                    enum:
                    - image
                    - font
                    - media
                    - stylesheet
                    - xhr
                    - fetch
                    type: string
                  description: Resource types to be intercepted during page loading to speed up extraction.
                wait_for_selector:
                  type: string
                  description: Wait for the CSS selector to appear before starting the extraction.
        required: true
      description: 'Extract structured content (title, body, images, product fields) from the given URL,
        with automatic page type detection. Full input requirements: https://platform.acedata.cloud/documents/webextrator-extract
        Submit once with async=true. Retain task_id and poll the matching task tool; a task ID is not
        a completed result. Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/webextrator-extract
  /webextrator/tasks:
    post:
      summary: Web extractor task query API — check the status and result of a render/extract task.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Task ID.
                  type:
                    type: string
                    description: Task type.
                  api_id:
                    type: string
                    description: API Identifier.
                  elapsed:
                    type: number
                    format: double
                    minimum: 0
                    nullable: true
                    description: Processing duration (seconds).
                  request:
                    type: object
                    description: Create the request body recorded for the API operation of this task;
                      the fields depend on the specific operation and action.
                    additionalProperties: true
                  user_id:
                    type: string
                    description: The account to which the task belongs.
                  response:
                    type: object
                    description: Create the final response recorded for the API operation of this task;
                      the fields follow the structure of the success or error response in the operation
                      documentation.
                    additionalProperties: true
                    properties: &id001
                      kind:
                        type: string
                      url:
                        type: string
                      finalUrl:
                        type: string
                      title:
                        type: string
                      markdown:
                        type: string
                      text:
                        type: string
                      success:
                        type: boolean
                      error:
                        type: object
                        properties:
                          code:
                            type: string
                          message:
                            type: string
                  trace_id:
                    type: string
                    description: Request tracking ID.
                  created_at:
                    type: number
                    format: double
                    description: Task creation time, Unix timestamp (seconds).
                  started_at:
                    type: number
                    format: double
                    description: Process start time, Unix timestamp (seconds).
                  finished_at:
                    type: number
                    format: double
                    nullable: true
                    description: Processing completion time, Unix timestamp (seconds).
                  actor_user_id:
                    type: string
                    nullable: true
                    description: The account for executing the authorization request.
                  credential_id:
                    type: string
                    nullable: true
                    description: Credentials used to start tasks.
                  application_id:
                    type: string
                    description: Application for billing.
                  authorization_id:
                    type: string
                    nullable: true
                    description: Authorization used when starting the task.
                  count:
                    type: integer
                    minimum: 0
                    description: Total number of matching tasks.
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - created_at
                      - trace_id
                      - request
                      properties:
                        id:
                          type: string
                          description: Task ID.
                        type:
                          type: string
                          description: Task type.
                        api_id:
                          type: string
                          description: API Identifier.
                        elapsed:
                          type: number
                          format: double
                          minimum: 0
                          nullable: true
                          description: Processing duration (seconds).
                        request:
                          type: object
                          description: Create the request body recorded for the API operation of this
                            task; the fields depend on the specific operation and action.
                          additionalProperties: true
                        user_id:
                          type: string
                          description: The account to which the task belongs.
                        response:
                          type: object
                          description: Create the final response recorded for the API operation of this
                            task; the fields follow the structure of the success or error response in
                            the operation documentation.
                          additionalProperties: true
                          properties: *id001
                        trace_id:
                          type: string
                          description: Request tracking ID.
                        created_at:
                          type: number
                          format: double
                          description: Task creation time, Unix timestamp (seconds).
                        started_at:
                          type: number
                          format: double
                          description: Process start time, Unix timestamp (seconds).
                        finished_at:
                          type: number
                          format: double
                          nullable: true
                          description: Processing completion time, Unix timestamp (seconds).
                        actor_user_id:
                          type: string
                          nullable: true
                          description: The account for executing the authorization request.
                        credential_id:
                          type: string
                          nullable: true
                          description: Credentials used to start tasks.
                        application_id:
                          type: string
                          description: Application for billing.
                        authorization_id:
                          type: string
                          nullable: true
                          description: Authorization used when starting the task.
                    description: Matching task list.
          description: Request successful. The `retrieve` operation returns a single task object; the
            `retrieve_batch` operation returns a `{items, count}` structure.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Request error - request body parameters are invalid.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: getTaskResults
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Task UUID, for use in the `retrieve` operation.
                ids:
                  type: array
                  items:
                    type: string
                  description: Task UUID list for use in the `retrieve_batch` operation.
                limit:
                  type: number
                  default: 12
                  description: The upper limit of the number of pages for the `retrieve_batch` operation.
                action:
                  enum:
                  - retrieve
                  - retrieve_batch
                  type: string
                  default: retrieve
                  description: 'Operation type: `retrieve` (query a single task) or `retrieve_batch` (batch
                    query tasks).'
                offset:
                  type: number
                  default: 0
                  description: The pagination offset of the `retrieve_batch` operation.
                trace_id:
                  type: string
                  description: Track UUID for use as a backup query condition in the `retrieve` operation.
                trace_ids:
                  type: array
                  items:
                    type: string
                  description: Track the UUID list for use in the `retrieve_batch` operation.
        required: true
      description: 'Web extractor task query API — check the status and result of a render/extract task.
        Full input requirements: https://platform.acedata.cloud/documents/webextrator-tasks A non-null
        response can be a progress snapshot. Require terminal success and a non-empty primary media URL
        or content, not just a cover image or an empty data array.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/webextrator-tasks
