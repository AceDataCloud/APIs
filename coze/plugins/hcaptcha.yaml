openapi: 3.0.1
info:
  title: AceData_hCaptcha_Tools
  version: 2.0.0
  description: 'Process supported hCaptcha token or recognition requests and retrieve task results in
    authorized testing workflows. Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN
    in Authorization. Usage is billed to your account. Never place a token in chat or shared examples.
    Start: https://platform.acedata.cloud/?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /captcha/tasks:
    post:
      summary: Read the persisted status of a server-managed asynchronous captcha task. The server starts
        monitoring after HTTP 201 and continues even if the client disconnect
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - task_id
                - status
                properties:
                  text:
                    type: string
                    description: The recognized text for recognition/image2text. Present only when status
                      is 'ready'.
                  type:
                    type: string
                    description: 任务类型。
                  token:
                    type: string
                    description: The solved verification token (token APIs). Present only when status
                      is 'ready'.
                  api_id:
                    type: string
                    description: 该任务所属接口的 ID。
                  status:
                    enum:
                    - processing
                    - ready
                    type: string
                    description: Persisted task state. 'processing' means the server is still working;
                      'ready' means the result is stored. Reading processing state has no lifecycle or
                      billing side effects.
                  elapsed:
                    type: number
                    description: Processing time in seconds (float, 3 decimals). Absent while the task
                      is still processing.
                  success:
                    type: boolean
                    description: Whether the query succeeded.
                  task_id:
                    type: string
                    description: The task id being polled.
                  user_id:
                    type: string
                    description: 发起该任务的账号 ID。
                  solution:
                    type: object
                    description: The recognition result for recognition/recaptcha2 and recognition/hcaptcha.
                      Present only when status is 'ready'.
                    additionalProperties: true
                  trace_id:
                    type: string
                    description: 本次请求的追踪 ID，排查问题时提供给技术支持。
                  started_at:
                    type: number
                    description: When the task began processing, as a Unix timestamp in seconds (float).
                  finished_at:
                    type: number
                    description: When the task produced its result, as a Unix timestamp in seconds (float).
                      Absent while the task is still processing.
                  actor_user_id:
                    type: string
                    description: 实际执行者的账号 ID。通过授权代发时与 `user_id` 不同。
                  credential_id:
                    type: string
                    description: 发起该任务所用凭证的 ID。
                  application_id:
                    type: string
                    description: 该任务计费所用应用的 ID。
                  authorization_id:
                    type: string
                    description: 该任务使用的授权 ID。未通过授权发起时为 null。
          description: OK, the request is successful.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Bad request, possibly due to a missing task_id.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Unauthorized, invalid or missing authorization token.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specifies the format of the response from the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: post__captcha_tasks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - task_id
              properties:
                task_id:
                  type: string
                  description: The task id returned when a token API was called with async=true.
        required: true
      description: 'Read the persisted status of a server-managed asynchronous captcha task. The server
        starts monitoring after HTTP 201 and continues even if the client disconnect Full input requirements:
        https://platform.acedata.cloud/documents/captcha-tasks A non-null response can be a progress snapshot.
        Require terminal success and a non-empty primary media URL or content, not just a cover image
        or an empty data array.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/captcha-tasks
  /captcha/recognition/hcaptcha:
    post:
      summary: hCaptcha image recognition ap i, pass in the content to be recognized and the image of
        hCaptcha, return the small map coordinates that need to be clicked.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  elapsed:
                    type: number
                    description: Total processing time (seconds).
                  solution:
                    type: object
                    properties:
                      box:
                        type: array
                        items:
                          type: string
                        description: The coordinate information of the position that needs to be clicked
                          in the recognition result (the coordinates of the corresponding area in hCaptcha).
                      label:
                        type: string
                        description: The target category name that hCaptcha needs to recognize (i.e.,
                          the challenge description in the captcha).
                      confidences:
                        type: number
                        description: Confidence scores for each area after captcha recognition.
                    description: Recognition result object, including coordinates, labels, and confidence
                      information.
                  started_at:
                    type: number
                    description: The time when this request starts processing, Unix timestamp (seconds,
                      floating point).
                  finished_at:
                    type: number
                    description: The time for the output of this request is the Unix timestamp (seconds,
                      floating point).
          description: Request successful, returning hCaptcha recognition result.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '403':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '429':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Too many requests, rate limit exceeded.
        '500':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Internal server error, an exception occurred on the server.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: post__captcha_recognition_hcaptcha
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                async:
                  type: boolean
                  default: true
                  description: When true, return immediately with a task_id instead of blocking until
                    the captcha is solved. Poll POST /captcha/tasks with that task_id to retrieve the
                    result. Billing occurs once, only on a solved result.
                queries:
                  type: array
                  items:
                    type: string
                  description: A list of Base64 encoded verification code images, with the nine small
                    images in hCaptcha encoded and passed in as an array.
                question:
                  type: string
                  description: The problem identifier for the CAPTCHA challenge, please fill in according
                    to the corresponding table, supporting both Chinese and English; other languages should
                    be converted first.
        required: true
      description: 'hCaptcha image recognition ap i, pass in the content to be recognized and the image
        of hCaptcha, return the small map coordinates that need to be clicked. Full input requirements:
        https://platform.acedata.cloud/documents/recognition-hcaptcha-integration Submit once with async=true.
        Retain task_id and poll the matching task tool; a task ID is not a completed result. Do not resubmit
        while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/recognition-hcaptcha-integration
  /captcha/token/hcaptcha:
    post:
      summary: hCaptcha verification code identification api, using this api users do not need to identify
        and click the image of the hCaptcha verification code, just by submi
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Verification result, that is, the hCaptcha token string returned after
                      successful recognition.
                  elapsed:
                    type: number
                    description: Total processing time (seconds).
                  started_at:
                    type: number
                    description: The time when this request starts processing, Unix timestamp (seconds,
                      floating point).
                  finished_at:
                    type: number
                    description: The time for the output of this request is the Unix timestamp (seconds,
                      floating point).
          description: Request successful.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Response error message.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    anyOf:
                    - type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    - type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Response error message.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '403':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, the authorization token is invalid or missing.
        '429':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Too many requests, rate limit exceeded.
        '500':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Internal server error, an exception occurred on the server.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: post__captcha_token_hcaptcha
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - website_key
              - website_url
              properties:
                async:
                  type: boolean
                  default: true
                  description: When true, return immediately with a task_id instead of blocking until
                    the token is solved. Poll POST /captcha/tasks with that task_id to retrieve the token.
                    Billing occurs once, only on a solved token.
                proxy:
                  type: string
                  description: Optional, Bring Your Own Proxy. After setting, the verification code will
                    be solved through the proxy IP you provide, used to control the quality of the exit
                    IP (for example, to avoid returning 410 Gone due to public proxy IP being blocked
                    by the target site). The format is scheme://[user:pass@]host:port, where the scheme
                    supports http/https/socks4/socks5, for example, http://user:pass@1.2.3.4:8080. If
                    not filled, the platform's default proxy will be used.
                rqdata:
                  type: string
                  description: Optional, the rqdata value of the hCaptcha Enterprise challenge. Fill it
                    in only if the target page provides data-rqdata, and keep the original value unchanged.
                website_key:
                  type: string
                  description: The hCaptcha sitekey of the target website, used to identify the captcha
                    instance to be recognized.
                website_url:
                  type: string
                  description: The target website URL with hCaptcha verification deployed.
        required: true
      description: 'hCaptcha verification code identification api, using this api users do not need to
        identify and click the image of the hCaptcha verification code, just by submi Full input requirements:
        https://platform.acedata.cloud/documents/captcha-token-hcaptcha Submit once with async=true. Retain
        task_id and poll the matching task tool; a task ID is not a completed result. Do not resubmit
        while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/captcha-token-hcaptcha
