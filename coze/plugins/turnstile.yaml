info:
  title: AceData_Turnstile_Tools
  version: 2.0.0
  description: 'Integrate Turnstile challenge processing into an authorized site-testing workflow using
    a site URL and site key. Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN
