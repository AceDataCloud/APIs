          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: post__captcha_token_turnstile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - website_key
              - website_url
              properties:
                async:
                  type: boolean
                  default: true
                  description: When true, return immediately with a task_id instead of blocking until
                    the token is solved. Poll POST /captcha/tasks with that task_id to retrieve the token.
                    Billing occurs once, only on a solved token.
                cdata:
                  type: string
                  description: Optional parameter, only required when the target website has set custom
                    cData for the Turnstile component.
                action:
                  type: string
                  description: Optional parameter, only required when the target website has set a custom
                    action for the Turnstile component.
                website_key:
                  type: string
                  description: The Cloudflare Turnstile sitekey of the target website, used to identify
                    the captcha instance to be recognized.
                website_url:
                  type: string
                  description: The target website URL with Cloudflare Turnstile captcha deployed.
        required: true
      description: 'Cloudflare Turnstile verification code identification api, using this api users do
        not need to identify and click the Turnstile challenge, just by submitting th Full input requirements:
        https://platform.acedata.cloud/documents/captcha-token-turnstile Submit once with async=true.
        Retain task_id and poll the matching task tool; a task ID is not a completed result. Do not resubmit
        while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/captcha-token-turnstile
  /captcha/tasks:
    post:
      summary: Read the persisted status of a server-managed asynchronous captcha task. The server starts
        monitoring after HTTP 201 and continues even if the client disconnect
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - task_id
                - status
                properties:
                  text:
                    type: string
                    description: The recognized text for recognition/image2text. Present only when status
                      is 'ready'.
                  type:
                    type: string
                    description: 任务类型。
                  token:
                    type: string
                    description: The solved verification token (token APIs). Present only when status
                      is 'ready'.
                  api_id:
                    type: string
                    description: 该任务所属接口的 ID。
                  status:
                    enum:
                    - processing
                    - ready
                    type: string
                    description: Persisted task state. 'processing' means the server is still working;
                      'ready' means the result is stored. Reading processing state has no lifecycle or
                      billing side effects.
                  elapsed:
                    type: number
                    description: Processing time in seconds (float, 3 decimals). Absent while the task
                      is still processing.
                  success:
                    type: boolean
                    description: Whether the query succeeded.
                  task_id:
                    type: string
                    description: The task id being polled.
                  user_id:
                    type: string
                    description: 发起该任务的账号 ID。
                  solution:
                    type: object
                    description: The recognition result for recognition/recaptcha2 and recognition/hcaptcha.
                      Present only when status is 'ready'.
                    additionalProperties: true
                  trace_id:
                    type: string
                    description: 本次请求的追踪 ID，排查问题时提供给技术支持。
                  started_at:
                    type: number
                    description: When the task began processing, as a Unix timestamp in seconds (float).
                  finished_at:
                    type: number
                    description: When the task produced its result, as a Unix timestamp in seconds (float).
                      Absent while the task is still processing.
                  actor_user_id:
                    type: string
                    description: 实际执行者的账号 ID。通过授权代发时与 `user_id` 不同。
                  credential_id:
                    type: string
                    description: 发起该任务所用凭证的 ID。
                  application_id:
                    type: string
                    description: 该任务计费所用应用的 ID。
                  authorization_id:
                    type: string
                    description: 该任务使用的授权 ID。未通过授权发起时为 null。
          description: OK, the request is successful.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Bad request, possibly due to a missing task_id.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Unauthorized, invalid or missing authorization token.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          type: string
        required: false
        description: Specifies the format of the response from the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: post__captcha_tasks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - task_id
              properties:
                task_id:
                  type: string
                  description: The task id returned when a token API was called with async=true.
        required: true
      description: 'Read the persisted status of a server-managed asynchronous captcha task. The server
        starts monitoring after HTTP 201 and continues even if the client disconnect Full input requirements:
        https://platform.acedata.cloud/documents/captcha-tasks'
      externalDocs:
        url: https://platform.acedata.cloud/documents/captcha-tasks
