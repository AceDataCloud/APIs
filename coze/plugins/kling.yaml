      description: 'Use audio or text to drive an existing Kling video (5 seconds or 10 seconds), allowing
        the characters within to sync their speech (lip-syncing). This can be combined with the image2video
        from /kling/videos to form a complete "talking photo" process. Full input requirements: https://platform.acedata.cloud/documents/kling-lip-sync
        Submit once with async=true. Retain task_id and poll the matching task tool; a task ID is not
        a completed result. Do not resubmit while pending.'
      operationId: post__kling_lip_sync
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  enum:
                  - audio2video
                  - text2video
                  type: string
                  description: 'audio2video: Drive with audio clips; text2video: Drive with text + tone.'
                text:
                  type: string
                  maxLength: 120
                  description: Text to be read aloud (required when mode is text2video, up to 120 characters).
                async:
                  type: boolean
                  default: true
                  description: Return task_id immediately when true; you can poll through /kling/tasks
                    or receive callbacks to get the result.
                video_id:
                  type: string
                  description: The ID of the video generated by Kling (for example, from /kling/videos
                    image2video) must be generated within the last 30 days. Choose one of video_url or
                    this.
                voice_id:
                  type: string
                  description: The tone used (required when mode is text2video).
                audio_url:
                  type: string
                  format: uri
                  description: The public URL for the audio drive (required when mode is audio2video).
                video_url:
                  type: string
                  format: uri
                  description: The public URL of the 5-second/10-second video that matches the lip sync.
                    Choose one between video_id.
                audio_file:
                  type: string
                  description: Base64 of the audio file (required when audio_type is file). Supports .mp3/.wav/.m4a/.aac,
                    not exceeding 5MB.
                audio_type:
                  enum:
                  - url
                  - file
                  type: string
                  default: url
                  description: The method of providing audio (for audio2video).
                voice_speed:
                  type: number
                  default: 1.0
                  maximum: 2.0
                  minimum: 0.8
                  description: The speech rate of text2video (0.8–2.0, keep one decimal place).
                callback_url:
                  type: string
                  format: uri
                  description: If provided (or async=true), it will immediately return task_id and push
                    the result via callback when ready.
                voice_language:
                  enum:
                  - zh
                  - en
                  type: string
                  default: zh
                  description: The tone language of text2video.
        required: true
      externalDocs:
        url: https://platform.acedata.cloud/documents/kling-lip-sync
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
