openapi: 3.0.1
info:
  title: AceData_Kling_Video_Studio
  version: 2.0.0
  description: 'Create videos, talking photos, lip sync and motion-controlled clips with Kling. Use commerce
    tools for supported product workflows and retrieve final tasks. Bind your own Ace Data Cloud credential
    privately as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never place
    a token in chat or shared examples. Start: https://platform.acedata.cloud/?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /kling/talking-photo:
    post:
      summary: Kling talking-photo API — make a still portrait speak from audio or text.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  success:
                    type: boolean
                  task_id:
                    type: string
                  duration:
                    type: number
                  video_id:
                    type: string
                  video_url:
                    type: string
                    format: uri
                  source_video_url:
                    type: string
                    format: uri
                additionalProperties: true
          description: Request successful.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Request error, it may be due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Unauthorized, authorization token is invalid or missing.
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Internal server error, an exception occurred on the server side.
      description: 'One-click "Talking Photo": Upload a photo of a person and a piece of driving audio.
        The service will automatically animate the photo (image2video) and then lip-sync with the audio,
        ultimately returning a talking video. No need to call in two steps yourself. Full input requirements:
        https://platform.acedata.cloud/documents/kling-talking-photo Submit once with async=true. Retain
        task_id and poll the matching task tool; a task ID is not a completed result. Do not resubmit
        while pending.'
      operationId: post__kling_talking_photo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - image_url
              - audio_url
              properties:
                mode:
                  enum:
                  - std
                  - pro
                  type: string
                  default: pro
                  description: The generation quality of photo animation stage.
                async:
                  type: boolean
                  default: true
                  description: Return task_id immediately when true; you can poll through /kling/tasks
                    or receive callbacks to get the result.
                model:
                  enum:
                  - kling-v1
                  - kling-v1-6
                  - kling-v2-master
                  - kling-v2-1-master
                  - kling-v2-5-turbo
                  - kling-v2-6
                  type: string
                  default: kling-v2-1-master
                  description: The Kling model used in the photo animation stage.
                prompt:
                  type: string
                  description: 'Optional: Action/expression prompts for the photo animation stage.'
                duration:
                  enum:
                  - 5
                  - 10
                  type: integer
                  default: 5
                  description: Video duration (seconds), while also limiting the length of the audio reading.
                audio_url:
                  type: string
                  format: uri
                  description: Public URL for audio (.mp3/.wav/.m4a/.aac, no more than 5MB), characters
                    will lip-sync according to its content.
                image_url:
                  type: string
                  format: uri
                  description: Public URL of the character photo, it is recommended to use a clear frontal
                    photo.
                callback_url:
                  type: string
                  format: uri
                  description: If provided (or async=true), it will immediately return task_id and push
                    the result via callback when ready.
        required: true
      externalDocs:
        url: https://platform.acedata.cloud/documents/kling-talking-photo
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
