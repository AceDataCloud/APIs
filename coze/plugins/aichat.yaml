                  - o1-pro
                  - o3
                  - o3-mini
                  - o3-pro
                  - o4-mini
                  - gemini-3.7-flash
                  - gemini-3.6-flash
                  - gemini-3.5-flash
                  - gemini-3.5-flash-lite
                  - gemini-3.1-flash-lite
                  - gemini-3.1-pro-preview
