  /aichat2/conversations:
    post:
      summary: AI Chat conversations API — next-gen chat endpoint with multimodal input, agentic tool
        calling, and streaming responses.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for the conversation. For action=chat, return the
                      newly created (or reused when the `id` is passed) session ID.
                  answer:
                    type: string
                    description: The text content that the assistant ultimately replies with. Returned
                      only when action=chat and accept is application/json.
            text/event-stream:
              schema:
                type: object
                description: 'Server-Sent Events stream. Each event is pushed in the format `data: {json}\n\n`.
                  The stream ends with a `done` event, followed by sending `data: [DONE]\n\n`. Event types
                  include `text_delta`, `thinking`, `tool_use`, `tool_result`, `card`, `citation`, `ask_user_question`,
                  `artifact`, `system_message`, `compact`, `error`, `done`.'
                additionalProperties: true
            application/x-ndjson:
              schema:
                type: object
                description: JSON stream separated by newline characters. Each line is a streaming event
                  from the agent loop. The most common event is `text_delta` (incremental reply text);
                  other events may carry tool calls, references, thought processes, user questions, and
                  so on. The final `done` event marks the end of the stream.
                additionalProperties: true
          description: 'Request successful. For action=chat, return the session result (JSON / NDJSON
            / SSE) based on the `accept` request header. For action=retrieve, return the complete session
            document. For action=retrieve_batch, return an `{ items, total }` object containing a list
            of session summaries. For action=update / delete, return `{ id, success: true }`.'
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Too many requests, rate limit exceeded.
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Internal server error, an exception occurred on the server.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          - application/x-ndjson
          - text/event-stream
          type: string
        required: false
        description: Response format. `application/json` (default) returns a single `{answer, id}` object
          after generation is complete; `application/x-ndjson` returns a JSON event stream separated by
          newline characters; `text/event-stream` pushes the same event content in Server-Sent Events
          format.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: post__aichat2_conversations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              properties:
                id:
                  type: string
                  description: 'Conversation identifier. It is a required field when action=retrieve /
                    update / delete. It is optional when action=chat: if `stateful: true` is set at the
                    same time, the conversation will continue (loading historical messages and appending
                    a new round of dialogue).'
                async:
                  type: boolean
                  default: true
                  description: Is it executed asynchronously? When set to true, the interface immediately
                    returns task_id / conversation_id, and the background continues to execute; you can
                    query the conversation through action=retrieve, or use callback_url to receive completion
                    callbacks.
                limit:
                  type: integer
                  default: 100
                  maximum: 100
                  minimum: 1
                  description: The pagination limit for action=retrieve_batch.
                model:
                  enum:
                  - gpt-6.1-sol
                  - gpt-6-sol
                  - gpt-6-luna
                  - grok-4.7
                  - gemini-3.8-flash
                  - gpt-4
