                  type: string
                  description: Specify the model to be used. It is a required field when action=chat;
                    it is an optional filtering condition when action=retrieve_batch.
                title:
                  type: string
                  description: Conversation title, effective only when action=update.
                action:
                  enum:
                  - chat
                  - retrieve
                  - retrieve_batch
                  - update
                  - delete
                  type: string
                  description: The operation to be performed is `chat` by default. `retrieve` loads a
                    single session (requires `id`); `retrieve_batch` lists session summaries (excluding
                    message details) and supports optional filtering conditions; `update` updates `title`
                    or `messages`; `delete` removes the session.
                  default: chat
                offset:
                  type: integer
                  default: 0
                  minimum: 0
                  description: The pagination offset of action=retrieve_batch.
                preset:
                  type: string
                  description: The preset name of the server-side system prompt applied to this round
                    of dialogue, effective in conjunction with skills and the MCP system prompts.
                message:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          description: When type=text, it is required.
                        type:
                          enum:
                          - text
                          - image_url
                          - file_url
                          type: string
                        file_url:
                          type: object
                          properties:
                            url:
                              type: string
                          description: Required when type=file_url.
                        image_url:
                          type: object
                          properties:
                            url:
                              type: string
                          description: Required when type=image_url.
                  description: The multimodal user content for this round of dialogue can be a pure string
                    or an array of content blocks. Each content block's `type` can be `text`, `image_url`,
                    or `file_url`. Please use this field for visual or file input; pure text input can
                    continue to use the backward-compatible `question` field.
                user_id:
                  type: string
                  description: Filter sessions by user, effective only when action=retrieve_batch (and
                    only when the caller does not carry user context).
                messages:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: The message history for replacement is only effective when action=update.
                question:
                  type: string
                  description: Plain text user prompt (compatible with v1 format). When the `message`
                    field is provided, this field will be ignored.
                stateful:
                  type: boolean
                  default: true
                  description: Whether to persist the session. When set to `true` (default), this round
                    of conversation will be stored with an `id`, allowing subsequent calls to continue
                    the session. For one-time requests that do not need to be saved, please set it to
                    `false`.
                max_turns:
                  type: integer
                  minimum: 1
                  description: The maximum number of iterations for the agent loop in this request is
                    constrained by the platform's default value. Each iteration corresponds to a model
                    call, and this value only needs to be increased when a long toolchain is expected.
                references:
                  type: array
                  items:
                    type: string
                  description: A list of optional reference URLs attached to this round of conversation.
                    URLs ending with image extensions (jpg / png / webp, etc.) will be automatically converted
                    to `image_url` content blocks, while other URLs will be converted to `file_url` content
                    blocks. This is suitable for v1 compatible scenarios where users do not want to manually
                    construct the `message` array.
                model_group:
                  enum:
                  - chatgpt
                  - claude
                  - gemini
                  - grok
                  - kimi
                  - glm
                  - deepseek
                  type: string
                  description: Filter sessions by service provider grouping, effective only when action=retrieve_batch.
                callback_url:
                  type: string
                  description: Asynchronous completion callback address. Only effective when async=true,
                    must use http/https; localhost and private IP literal addresses will be rejected.
                tool_results:
                  type: array
                  items:
                    type: object
                    required:
                    - tool_use_id
                    - output
                    properties:
                      output:
                        type: string
                        description: User's response to the issues to be addressed.
                      is_error:
                        type: boolean
                        description: Set to true indicates that the user refuses to answer or is unable
                          to answer, and the model will respond accordingly.
                      tool_use_id:
                        type: string
                        description: Must match the `tool_id` of the ask_user_question block to be processed.
                  description: Used to resume a session that was paused due to `ask_user_question`. Exactly
                    one record must be provided, and its `tool_use_id` must match the tool_use block to
                    be processed. After setting this field, the `question`, `message`, and `references`
                    fields will be ignored.
                allowed_skills:
                  type: array
                  items:
                    type: string
                  description: 'List of Skill slugs for unattended pre-authorization. Applicable to scenarios
                    such as alert Webhooks, automated tasks, etc., where no human confirmation is required;
                    the selected Skill can be used with --unattended-confirm when its tools support it.
                    Example: [''acedatacloud/personal-wechat''].'
                application_id:
                  type: string
                  description: Filter sessions by application, effective only when action=retrieve_batch.
                unattended_policy:
                  type: object
                  properties:
                    expires_at:
                      type: integer
                    allowed_skills:
                      type: array
                      items:
                        type: string
                    allowed_mcp_servers:
                      type: array
                      items:
                        type: string
                  description: Advanced unattended authorization policy. You can set mode, allowed_skills,
                    allowed_mcp_servers, and expires_at; usually, you can directly use the top-level abbreviations
                    of allowed_skills / allowed_mcp_servers.
                allowed_mcp_servers:
                  type: array
                  items:
                    type: string
                  description: List of MCP server slugs for unattended pre-authorization. MCP servers
                    not listed will not be loaded in unattended requests. The slug comes from the normalized
                    result of the display name of the connected MCP server.
        required: true
      description: 'AI Chat conversations API — next-gen chat endpoint with multimodal input, agentic
        tool calling, and streaming responses. Full input requirements: https://platform.acedata.cloud/documents/aichat2-conversations
        Submit once with async=true. Retain task_id and poll the matching task tool; a task ID is not
        a completed result. Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/aichat2-conversations
