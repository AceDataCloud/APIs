openapi: 3.0.1
info:
  title: AceData_AI_Dialogue
  version: 2.0.0
  description: 'Start and retrieve conversations using Ace Data Cloud''s multi-model conversation APIs.
    Select a model explicitly and keep conversation IDs for follow-up turns. Bind your own Ace Data Cloud
    credential privately as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never
    place a token in chat or shared examples. Start: https://platform.acedata.cloud/?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /aichat/conversations:
    post:
      summary: Use Large Language Model to generate answers for the given prompt, which can supports all
        kind of models, such as GPT-3, GPT-4, GPT-4-Browsing, etc
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for this conversation.
                  answer:
                    type: string
                    description: Responses generated based on the given prompt.
          description: OK, request successful.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
