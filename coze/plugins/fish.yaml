  /fish/model/{id}:
    get:
      summary: Fish Audio model detail API — fetch details of a single voice model by its ID.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: The unique identifier of the sound model.
                  tags:
                    type: array
                    items:
                      type: string
                    description: A list of free format labels attached to the model.
                  type:
                    type: string
                    description: Types of voice models (such as `tts`, `svc`).
                  state:
                    type: string
                    description: The current state of the model (such as `trained`, `training`).
                  title:
                    type: string
                    description: Display name of the voice model.
                  author:
                    type: object
                    description: Public information about the model author.
                    additionalProperties: true
                  samples:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: The list of preview audio samples for this sound model.
                  languages:
                    type: array
                    items:
                      type: string
                    description: List of languages supported by this voice model.
                  created_at:
                    type: string
                    format: date-time
                    description: The creation time of the model.
                  train_mode:
                    type: string
                    description: The training mode used to build this model.
                  updated_at:
                    type: string
                    format: date-time
                    description: The last update time of the model.
                  visibility:
                    type: string
                    description: 'The visibility of the model: `public` or `private`.'
                  cover_image:
                    type: string
                    description: The URL address of the model cover image.
                  description:
                    type: string
                    description: Detailed description information of the voice model.
          description: Request successful, returning sound model details.
