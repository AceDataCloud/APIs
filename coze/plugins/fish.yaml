      operationId: textToSpeech
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  description: Text content to be synthesized. Required, must be a non-empty string.
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                top_p:
                  type: number
                  description: Top-p nucleus sampling parameter, controls output diversity.
                format:
                  enum:
                  - mp3
                  - wav
                  - pcm
                  type: string
                  description: Output audio format, default is `mp3`. Optional `mp3`, `wav`, `pcm`, where
                    both `wav` and `pcm` return a WAV container.
                latency:
                  enum:
                  - normal
                  - balanced
                  type: string
                  description: Delay mode. Does not accept null values; defaults to `normal` when omitted.
                prosody:
                  type: object
                  description: Rhythm coverage parameters (such as speech rate, volume, etc.).
                  additionalProperties: true
                normalize:
                  type: boolean
                  description: Is text normalization processing performed on the input text?
                references:
                  type: array
                  items:
                    type: object
                    required:
                    - audio
                    - text
                    properties:
                      text:
                        type: string
                        maxLength: 10000
                        minLength: 1
                        description: The accurate verbatim transcript of what was actually said in the
                          reference audio.
                      audio:
                        type: string
                        format: uri
                        maxLength: 2048
                        description: Public HTTPS URL of the reference audio. Supports MP3 or WAV, recommended
                          10–270 seconds; Base64, data URI, or credentialed URLs are not accepted.
                    additionalProperties: false
                  maxItems: 1
                  minItems: 1
                  description: Inline reference audio samples for zero-shot voice cloning.
                mp3_bitrate:
                  enum:
                  - 64
                  - 128
                  - 192
                  type: integer
                  description: MP3 bitrate when `format=mp3`.
                sample_rate:
                  type: integer
                  description: Output the audio sampling rate (e.g., 16000, 22050, 44100).
                temperature:
                  type: number
                  description: Sampling temperature (0.0–1.0). The higher the value, the more diverse
                    the output; the lower the value, the more stable and consistent it is.
                callback_url:
                  type: string
                  description: 'Optional callback URL. When specified, the interface immediately returns
                    `{"task_id": "5872ab00-3cf4-4040-a798-8510aaa16756", "started_at": "2025-05-09T12:34:56.789Z"}`,
                    and after the synthesis is complete, the final `{audio_url, ...}` result will be pushed
                    to this URL via POST.'
                chunk_length:
                  type: integer
                  description: The block length of speech synthesis.
                reference_id:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                    minItems: 1
                  description: Voice model ID (single speaker). A string array can also be passed in multi-speaker
                    scenarios.
                max_new_tokens:
                  type: integer
                  description: Maximum number of new tokens generated.
                min_chunk_length:
                  type: integer
                  description: Minimum block length.
                repetition_penalty:
                  type: number
                  description: The repetition penalty coefficient applied during the generation process.
        required: true
      description: 'Fish Audio text-to-speech API — convert text into natural speech using a chosen voice
        model. Full input requirements: https://platform.acedata.cloud/documents/fish-tts Submit once
        with async=true. Retain task_id and poll the matching task tool; a task ID is not a completed
        result. Do not resubmit while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/fish-tts
