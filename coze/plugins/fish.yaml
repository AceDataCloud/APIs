  /fish/tts:
    post:
      summary: Fish Audio text-to-speech API — convert text into natural speech using a chosen voice model.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  cost:
                    type: object
                    required:
                    - amount
                    - currency
                    properties:
                      amount:
                        type: number
                        description: The Credits actually deducted in this request have included the applicable
                          account discounts.
                      currency:
                        type: string
                        description: Billing unit; the ordinary quota call returns `credit`.
                      list_amount:
                        type: number
                        description: Credits before discount; only returns when it differs from the actual
                          deduction amount.
                    description: The final successful synthesis of the actual billing amount information.
                      The initial task confirmation of the asynchronous request does not include this
                      field, while the final callback and task result include this field.
                  audio_url:
                    type: string
                    description: The URL of the generated audio file.
          description: Request successful (OK).
        '400':
