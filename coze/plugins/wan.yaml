  /wan/videos:
    post:
      summary: '{''zh-cn'': ''使用 Wan 生成视频，支持文本、首尾帧以及图像/视频/音频等参考素材。'', ''en'': ''Use Wan to generate videos,
        supporting text, first and last frames, as well as reference materials such'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    description: The current status of video generation tasks.
                  prompt:
                    type: string
                    description: Prompts for generating videos.
                  success:
                    type: boolean
                    description: Indicate whether the task was successfully executed.
                  task_id:
                    type: string
                    description: The ID of the video generation task.
                  video_id:
                    type: string
                    description: The unique identifier for generating a video.
                  video_url:
                    type: string
                    description: Generate the access URL for the video.
                  video_width:
                    type: number
                    description: The width of the generated video (in pixels).
                  video_height:
                    type: number
                    description: Height of the video (pixels).
                  thumbnail_url:
                    type: string
                    description: Access URL for generating video thumbnails.
                  thumbnail_width:
                    type: number
                    description: The width of the generated video thumbnail (pixels).
                  thumbnail_height:
                    type: number
                    description: Height of the generated video thumbnail (pixels).
          description: Video generation successful or operation executed successfully.
