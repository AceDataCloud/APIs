        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: generateVideo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              properties:
                seed:
                  type: integer
                  maximum: 2147483647
                  minimum: 0
                  description: Wan 3 random seed.
                size:
                  type: string
                  description: Video size specifications.
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                audio:
                  type: boolean
                  default: false
                  description: Specify whether the generated video contains sound.
                media:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - url
                    properties:
                      url:
                        type: string
                      type:
                        enum:
                        - first_frame
                        - last_frame
                        - reference_image
                        - reference_video
                        - reference_audio
                        - file
                        - link
                        type: string
                  maxItems: 10
                  description: Wan 3 multimodal material array, supporting first and last frames, reference
                    images, video, audio, files, and web pages.
                model:
                  enum:
                  - wan2.6-i2v
                  - wan2.6-r2v
                  - wan2.6-i2v-flash
                  - wan2.6-t2v
                  - wan3.0-video
                  type: string
                  description: Models for generating videos include optional values such as `wan2.6-t2v`
                    (text-to-video), `wan2.6-i2v` (image-to-video), `wan2.6-i2v-flash` (fast version of
                    image-to-video), and `wan2.6-r2v` (reference video generation).
                  default: wan2.6-t2v
                ratio:
                  enum:
                  - adaptive
                  - '16:9'
                  - '4:3'
                  - '1:1'
                  - '3:4'
                  - '9:16'
                  type: string
                  description: Wan 3 output aspect ratio.
                action:
                  enum:
                  - text2video
                  - image2video
                  type: string
                  default: text2video
                  description: Operation types. `text2video` indicates text-to-video, and `image2video`
                    indicates image-to-video.
                prompt:
                  type: string
                  description: Prompts for generating videos.
                duration:
                  type: number
                  oneOf:
                  - type: integer
                    maximum: 30
                    minimum: 2
                  - enum:
                    - -1
                    type: integer
                  description: Specify the duration of the video to be generated (in seconds), with optional
                    values of `5`, `10`, or `15`.
                audio_url:
                  type: string
                  description: The URL of the audio file, the model will generate the corresponding video
                    based on that audio.
                image_url:
                  type: string
                  description: The URL of the starting frame image, which will serve as the first frame
                    of the generated video.
                shot_type:
                  enum:
                  - single
                  - multi
                  type: string
                  description: Specify the type of shots for the video, that is, whether the video consists
                    of a single continuous shot (`single`) or multiple switching shots (`multi`).
                watermark:
                  type: boolean
                  default: false
                  description: Whether Wan 3 adds a watermark.
                resolution:
                  enum:
                  - 480P
                  - 720P
                  - 1080P
                  type: string
                  description: Specify the resolution level for generating the video, used to adjust the
                    video clarity (total pixel count). The model will automatically scale to a similar
                    total pixel count based on the selected resolution level, and the aspect ratio of
                    the generated video will strive to remain consistent with the aspect ratio of the
                    input image `image_url`.
                callback_url:
                  type: string
                  description: Asynchronous notification Webhook callback URL.
                prompt_extend:
                  type: boolean
                  default: false
                  description: Whether to enable intelligent rewriting of prompts. Once enabled, a large
                    model will be used to intelligently expand the input prompts, which can significantly
                    improve the generation effect of shorter prompts, but will increase processing time.
                negative_prompt:
                  type: string
                  description: Reverse prompt words, used to describe content that is not desired to appear
                    in the video footage, can be used to limit the video visuals. Supports both Chinese
                    and English, with a length not exceeding 500 characters; any excess will be automatically
                    truncated.
                reference_video_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  minItems: 1
                  description: An array of URLs for reference video files, used to extract the character
                    images (and vocal tones, if any) from the reference videos to generate videos that
                    match the reference features.
        required: true
      description: '{''zh-cn'': ''使用 Wan 生成视频，支持文本、首尾帧以及图像/视频/音频等参考素材。'', ''en'': ''Use Wan to generate
        videos, supporting text, first and last frames, as well as reference materials such Full input
        requirements: https://platform.acedata.cloud/documents/wan-videos Submit once with async=true.
        Retain task_id and poll the matching task tool; a task ID is not a completed result. Do not resubmit
        while pending.'
      externalDocs:
        url: https://platform.acedata.cloud/documents/wan-videos
