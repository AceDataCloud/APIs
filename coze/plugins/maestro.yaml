openapi: 3.0.1
info:
  title: AceData_Maestro_Video_Studio
  version: 2.0.0
  description: 'Produce an end-to-end video from a creative brief with visual style, narration and language
    controls. Retrieve the task to get the finished video. Bind your own Ace Data Cloud credential privately
    as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never place a token in
    chat or shared examples. Start: https://platform.acedata.cloud/services/0d7031bf-610a-419e-a5a0-db8f240286d5?from=coze'
servers:
- url: https://api.acedata.cloud
