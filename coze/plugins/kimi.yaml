openapi: 3.0.1
info:
  title: Kimi
  version: 2.0.0
  description: 'Use Kimi models to draft, reason about and summarize text in an agent or workflow. Bind
    your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization. Usage is billed
    to your account. Never place a token in chat or shared examples. Start: https://platform.acedata.cloud/services/7ef9ec1d-f0fb-453c-be72-36d5124e5aa1?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /kimi/chat/completions:
    post:
      summary: Kimi Chat Completion API, compatible with the official interface format.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - choices
                - created
                - id
                - model
                - object
                properties:
                  id:
                    type: string
                    description: The unique identifier for dialogue completion.
                  model:
                    type: string
                    description: Model used for completing this conversation.
                  usage:
                    type: object
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    properties:
                      total_tokens:
                        type: integer
                        description: The total number of tokens used in this request (prompt + completion).
                      prompt_tokens:
                        type: integer
                        description: The number of tokens in the prompt.
                      completion_tokens:
                        type: integer
                        description: The number of tokens in the generated completion content.
                      prompt_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of audio input tokens in the prompt.
                          cached_tokens:
                            type: integer
                            description: The number of tokens in the prompt that hit the cache.
                        description: Details of token usage for prompts.
                      completion_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of tokens in the audio output generated by the model.
                          reasoning_tokens:
                            type: integer
                            description: The number of tokens generated by the model for inference.
                          accepted_prediction_tokens:
                            type: integer
                            description: The number of tokens that appear in the completion of the predicted
                              content when using predicted outputs.
                          rejected_prediction_tokens:
                            type: integer
                            description: The number of tokens in the predicted content that do not appear
                              in the completion when using predicted outputs.
                        description: Complete the token usage details.
                    description: Usage statistics for this completion request.
                  object:
                    enum:
                    - chat.completion
                    type: string
                    description: Object type, fixed as `chat.completion`.
                  choices:
                    type: array
                    items:
                      type: object
                      required:
                      - finish_reason
                      - index
                      - message
                      properties:
                        index:
                          type: number
                          description: The index of the option in the list of options.
                        message:
                          type: object
                          required:
                          - role
                          properties:
                            role:
                              enum:
                              - assistant
                              type: string
                              description: The role of the author of the message.
                            audio:
                              type: object
                              nullable: true
                              required:
                              - id
                              - data
                              - expires_at
                              properties:
                                id:
                                  type: string
                                  description: The unique identifier for the audio reply.
                                data:
                                  type: string
                                  description: Base64 encoded audio bytes generated by the model.
                                expires_at:
                                  type: integer
                                  description: The audio reply is no longer available on the server (for
                                    multi-turn conversations) Unix timestamp (seconds).
                                transcript:
                                  type: string
                                  description: Text transcription of audio generated by the model.
                              description: When the audio output modality is requested, this object contains
                                the audio response data returned by the model.
                            content:
                              type: string
                              nullable: true
                              description: Content of the message.
                            refusal:
                              type: string
                              nullable: true
                              description: The message generated by the model to refuse to answer.
                            tool_calls:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - type
                                - function
                                properties:
                                  id:
                                    type: string
                                    description: The ID of the tool call.
                                  type:
                                    enum:
                                    - function
                                    type: string
                                    description: The type of tool invocation. Currently, only `function`
                                      is supported.
                                  function:
                                    type: object
                                    required:
                                    - name
                                    - arguments
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the function to be called.
                                      arguments:
                                        type: string
                                        description: The parameters used when calling the function are
                                          generated by the model in JSON format.
                                    description: Function for model invocation.
                              nullable: true
                              description: Tool calls generated by the model, such as function calls.
                            reasoning_content:
                              type: string
                              nullable: true
                              description: Kimi K3 generated inference content. In multi-turn dialogues
                                and tool calls, please return this field along with the complete assistant
                                message.
                          description: A message completing a dialogue generated by the model.
                        logprobs:
                          type: object
                          nullable: true
                          description: The logarithmic probability information of this option.
                          additionalProperties: true
                        finish_reason:
                          enum:
                          - stop
                          - length
                          - tool_calls
                          - content_filter
                          - function_call
                          type: string
                          description: Reasons for the model to stop generating tokens. If the model reaches
                            a natural stopping point or hits the provided stopping sequence, it is `stop`;
                            if it reaches the maximum token number specified in the request, it is `length`;
                            if content is omitted due to content filter flags, it is `content_filter`;
                            if the model called a tool, it is `tool_calls`; if the model called a function
                            (deprecated), it is `function_call`.
                    description: Dialogue completion options list. If `n` is greater than 1, it can include
                      multiple options.
                  created:
                    type: number
                    description: Create the Unix timestamp (seconds) when this conversation is completed.
                  system_fingerprint:
                    type: string
                    description: This fingerprint indicates the backend configuration used for the model
                      run. It can be used in conjunction with the request parameter `seed` to understand
                      when changes that may affect determinism occurred in the backend.
                description: Indicates a dialogue completion response returned by the model based on the
                  provided input.
            text/event-stream:
              schema:
                type: object
                required:
                - id
                - object
                - created
                - model
                - choices
                properties:
                  id:
                    type: string
                  model:
                    type: string
                  usage:
                    type: object
                    nullable: true
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    properties:
                      total_tokens:
                        type: integer
                        description: The total number of tokens used in this request (prompt + completion).
                      prompt_tokens:
                        type: integer
                        description: The number of tokens in the prompt.
                      completion_tokens:
                        type: integer
                        description: The number of tokens in the generated completion content.
                      prompt_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of audio input tokens in the prompt.
                          cached_tokens:
                            type: integer
                            description: The number of tokens in the prompt that hit the cache.
                        description: Details of token usage for prompts.
                      completion_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of tokens in the audio output generated by the model.
                          reasoning_tokens:
                            type: integer
                            description: The number of tokens generated by the model for inference.
                          accepted_prediction_tokens:
                            type: integer
                            description: The number of tokens that appear in the completion of the predicted
                              content when using predicted outputs.
                          rejected_prediction_tokens:
                            type: integer
                            description: The number of tokens in the predicted content that do not appear
                              in the completion when using predicted outputs.
                        description: Complete the token usage details.
                    description: 仅在启用 stream_options.include_usage 时随结束前的用量数据块返回。
                  object:
                    enum:
                    - chat.completion.chunk
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      required:
                      - index
                      - delta
                      - finish_reason
                      properties:
                        delta:
                          type: object
                          properties:
                            role:
                              enum:
                              - assistant
                              type: string
                              nullable: true
                            content:
                              type: string
                              nullable: true
                            tool_calls:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - type
                                - function
                                properties:
                                  id:
                                    type: string
                                    description: The ID of the tool call.
                                  type:
                                    enum:
                                    - function
                                    type: string
                                    description: The type of tool invocation. Currently, only `function`
                                      is supported.
                                  function:
                                    type: object
                                    required:
                                    - name
                                    - arguments
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the function to be called.
                                      arguments:
                                        type: string
                                        description: The parameters used when calling the function are
                                          generated by the model in JSON format.
                                    description: Function for model invocation.
                              nullable: true
                              description: Tool calls generated by the model, such as function calls.
                            reasoning_content:
                              type: string
                              nullable: true
                        index:
                          type: integer
                        finish_reason:
                          type: string
                          nullable: true
                    description: Incremental output; the usage data block can be an empty array.
                  created:
                    type: integer
                  system_fingerprint:
                    type: string
                    nullable: true
          description: 'Non-streaming requests return JSON; when stream=true, SSE is returned. Each event
            is data: {chat.completion.chunk}, with optional usage data blocks having empty choices, and
            ends with data: [DONE].'
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '429':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Too many requests, rate limit exceeded.
        '500':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Internal server error, an exception occurred on the server side.
      parameters:
      - in: header
        name: accept
        schema:
          enum:
          - application/json
          - text/event-stream
          type: string
        required: false
        description: Specify the response format returned by the server.
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: chatCompletion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - messages
              properties:
                n:
                  type: integer
                  default: 1
                  maximum: 1
                  minimum: 1
                  nullable: true
                  description: Generate how many dialogue completion options for each input message.
                seed:
                  type: integer
                  nullable: true
                  description: If specified, the system will strive to perform deterministic sampling,
                    so that repeated requests using the same `seed` and parameters return the same results.
                    Determinism cannot be guaranteed; please refer to the `system_fingerprint` in the
                    response to monitor backend changes.
                stop:
                  oneOf:
                  - type: string
                    description: Single stop sequence.
                  - type: array
                    items:
                      type: string
                    maxItems: 4
                    minItems: 1
                    description: Up to 4 stop sequences.
                  nullable: true
                  description: A maximum of 4 sequences, the API will stop generating when it reaches
                    these sequences. The returned text does not include the stopping sequences.
                user:
                  type: string
                  description: A unique identifier representing your end users, which helps the platform
                    monitor and detect abusive behavior.
                audio:
                  type: object
                  nullable: true
                  required:
                  - voice
                  - format
                  properties:
                    voice:
                      enum:
                      - alloy
                      - ash
                      - ballad
                      - coral
                      - echo
                      - fable
                      - nova
                      - onyx
                      - sage
                      - shimmer
                      type: string
                      description: The tone used by the model in its responses.
                    format:
                      enum:
                      - wav
                      - aac
                      - mp3
                      - flac
                      - opus
                      - pcm16
                      type: string
                      description: Specify the output audio format.
                  description: 'Audio output parameters. Required when requesting audio output via `modalities:
                    ["audio"]`.'
                model:
                  enum:
                  - kimi-k3
                  - kimi-k2.6
                  - kimi-k2-thinking-turbo
                  - kimi-k2.5
                  - kimi-k2-thinking
                  type: string
                  description: Model ID to be used.
                store:
                  type: boolean
                  default: false
                  nullable: true
                  description: Whether to store the output of this conversation completion request for
                    model distillation or product evaluation.
                tools:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - function
                    properties:
                      type:
                        enum:
                        - function
                        type: string
                        description: Type of tool. Currently only supports `function`.
                      function:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            description: The name of the function to be called.
                          parameters:
                            type: object
                            description: The parameters accepted by this function are described by a JSON
                              Schema object.
                            additionalProperties: true
                          description:
                            type: string
                            description: Description of the function's functionality.
                        description: Function definition.
                  nullable: true
                  description: List of tools that can be called by the model. Currently, only functions
                    are supported as tools.
                top_p:
                  type: number
                  default: 1
                  maximum: 1
                  minimum: 0
                  nullable: true
                  description: An alternative method for temperature sampling, called nucleus sampling,
                    considers only the portion of tokens whose cumulative probability mass reaches top_p.
                    For example, 0.1 means only considering the tokens that account for the top 10% of
                    cumulative probability mass. It is generally recommended to adjust only one of these
                    parameters or `temperature`, rather than adjusting both simultaneously.
                stream:
                  type: boolean
                  default: false
                  nullable: true
                  description: Use false for Coze JSON tool results.
                  enum:
                  - false
                logprobs:
                  type: boolean
                  default: false
                  nullable: true
                  description: Whether to return the logarithmic probability of the output tokens. If
                    true, it will return the logarithmic probability of each output token in the `content`
                    of `message`.
                messages:
                  type: array
                  items:
                    type: object
                    required:
                    - role
                    properties:
                      name:
                        type: string
                        description: Optional names for participants. Used to provide information to the
                          model to distinguish different participants under the same role.
                      role:
                        enum:
                        - user
                        - assistant
                        - system
                        - developer
                        - tool
                        type: string
                        description: The role of the message.
                      content:
                        oneOf:
                        - type: string
                          description: Text content of the message.
                        - type: array
                          items:
                            oneOf:
                            - type: object
                              required:
                              - type
                              - text
                              properties:
                                text:
                                  type: string
                                  description: Text content.
                                type:
                                  enum:
                                  - text
                                  type: string
                                  description: Types of content sections.
                            - type: object
                              required:
                              - type
                              - image_url
                              properties:
                                type:
                                  enum:
                                  - image_url
                                  type: string
                                  description: Types of content sections.
                                image_url:
                                  type: object
                                  required:
                                  - url
                                  properties:
                                    url:
                                      type: string
                                      description: Image URL or Base64 encoded image data.
                                    detail:
                                      enum:
                                      - auto
                                      - low
                                      - high
                                      type: string
                                      default: auto
                                      description: Specify the detail level of the image.
                                  description: Image URL or Base64 encoded image data.
                            - type: object
                              required:
                              - type
                              - file
                              properties:
                                file:
                                  type: object
                                  properties:
                                    file_id:
                                      type: string
                                      description: The ID of the uploaded file used as input.
                                    filename:
                                      type: string
                                      description: Filename, used to pass the file to the model in string
                                        form.
                                    file_data:
                                      type: string
                                      description: Base64 encoded file data, used to pass the file as
                                        a string to the model.
                                  description: File data sent to the model.
                                type:
                                  enum:
                                  - file
                                  type: string
                                  description: The type of the content part is fixed as `file`.
                          minItems: 1
                          description: An array of content parts with specified types, which can include
                            text, image_url, and file inputs.
                        description: The content of the message. It can be a string of plain text messages
                          or an array composed of multiple content parts (used for text, image_url, and
                          file, etc. in multimodal messages).
                      refusal:
                        type: string
                        nullable: true
                        description: The assistant's refusal to answer messages. Use when `role` is `assistant`.
                      tool_calls:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - type
                          - function
                          properties:
                            id:
                              type: string
                              description: The ID of the tool call.
                            type:
                              enum:
                              - function
                              type: string
                              description: Type of tools. Currently, only `function` is supported.
                            function:
                              type: object
                              required:
                              - name
                              - arguments
                              properties:
                                name:
                                  type: string
                                  description: The name of the function to be called.
                                arguments:
                                  type: string
                                  description: The parameters used when calling the function are generated
                                    by the model in JSON format.
                        description: The tool calls generated by the model in the previous round (when
                          `role` is `assistant`). Please return it along with the `tool` message that
                          contains the results of the tool call.
                      tool_call_id:
                        type: string
                        description: The tool call that responds to this message. It is required when
                          the role is `tool`.
                      reasoning_content:
                        type: string
                        nullable: true
                        description: The reasoning content of Kimi K3 in the previous round of assistant
                          messages. Multi-turn dialogue and tool calls should be returned as is.
                  minItems: 1
                  description: List of messages that make up the current conversation.
                metadata:
                  type: object
                  nullable: true
                  description: A set of key-value pairs that can be attached to an object, with a maximum
                    of 16 pairs. It can be used to store additional information about the object in a
                    structured format. The key is a string of up to 64 characters, and the value is a
                    string of up to 512 characters.
                  additionalProperties:
                    type: string
                thinking:
                  type: object
                  nullable: true
                  required:
                  - type
                  properties:
                    keep:
                      enum:
                      - all
                      type: string
                      nullable: true
                    type:
                      enum:
                      - enabled
                      - disabled
                      type: string
                  description: 'Only for the K2 series. The `type` can be set to `enabled` or `disabled`;
                    when enabled, `keep: all` can be used to retain historical reasoning content. For
                    K3, please use `reasoning_effort`.'
                  x-allowed-models:
                  - kimi-k2.6
                logit_bias:
                  type: object
                  nullable: true
                  description: Modify the likelihood of a specified token appearing in the completion.
                    Accept a JSON object that maps the token (specified by its token ID in the tokenizer)
                    to a bias value between -100 and 100.
                  additionalProperties:
                    type: integer
                max_tokens:
                  type: number
                  nullable: true
                  description: The maximum number of tokens that can be generated in dialogue completion.
                modalities:
                  type: array
                  items:
                    enum:
                    - text
                    - audio
                    type: string
                  nullable: true
                  description: You hope for the output type generated by the model. Most models default
                    to `["text"]`. The `gpt-4o-audio-preview` model can also be used to generate audio.
                    If you want the model to generate both text and audio responses, you can use `["text",
                    "audio"]`.
                prediction:
                  type: object
                  nullable: true
                  required:
                  - type
                  - content
                  properties:
                    type:
                      enum:
                      - content
                      type: string
                      description: Predict the type of content, fixed as `content`.
                    content:
                      oneOf:
                      - type: string
                        description: Content for prediction.
                      - type: array
                        items:
                          type: object
                          required:
                          - type
                          - text
                          properties:
                            text:
                              type: string
                            type:
                              enum:
                              - text
                              type: string
                      description: Content for prediction.
                  description: Static prediction output content, such as the content of a text file that
                    is being regenerated. It can be used to shorten response time when most of the response
                    content is already known in advance.
                temperature:
                  type: number
                  default: 1
                  maximum: 2
                  minimum: 0
                  nullable: true
                  description: The sampling temperature used ranges from 0 to 2. Higher values (such as
                    0.8) will make the output more random, while lower values (such as 0.2) will make
                    the output more focused and certain.
                tool_choice:
                  oneOf:
                  - enum:
                    - none
                    - auto
                    - required
                    type: string
                    description: Control which tool the model calls (if any).
                  - type: object
                    required:
                    - type
                    - function
                    properties:
                      type:
                        enum:
                        - function
                        type: string
                        description: Type of tool. Currently only supports `function`.
                      function:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            description: The name of the function to be called.
                    description: Specify the tools that the designated model should use.
                  description: Control which tool the model calls (if any). `none` means the model will
                    not call any tools; `auto` means the model can choose between generating a message
                    or calling one/multiple tools; `required` means the model must call one or more tools.
                service_tier:
                  enum:
                  - auto
                  - default
                  - flex
                  - scale
                  - priority
                  type: string
                  default: auto
                  nullable: true
                  description: Specify the processing type used for the designated service request. Set
                    to `auto` to let the platform choose automatically, `default` for standard pricing/performance,
                    `flex` for a slower but cheaper Flex processing layer, and `priority` for the fastest
                    processing layer on supported models.
                top_logprobs:
                  type: integer
                  maximum: 20
                  minimum: 0
                  nullable: true
                  description: The integer value between 0 and 20 specifies the number of most likely
                    tokens to return at each token position, each accompanied by the corresponding log
                    probability. When using this parameter, `logprobs` must be set to `true`.
                stream_options:
                  type: object
                  nullable: true
                  properties:
                    include_usage:
                      type: boolean
                      description: 'If set, an additional chunk will be streamed back before the `data:
                        [DONE]` message. The `usage` field of this chunk displays the token usage statistics
                        for the entire request, while the `choices` field will always be an empty array.'
                  description: 'Options for streaming responses. Use only when setting `stream: true`.'
                response_format:
                  oneOf:
                  - type: object
                    required:
                    - type
                    properties:
                      type:
                        enum:
                        - text
                        type: string
                        description: Plain text response format.
                    description: Default text response format.
                  - type: object
                    required:
                    - type
                    properties:
                      type:
                        enum:
                        - json_object
                        type: string
                        description: Enable JSON Object mode.
                    description: JSON Object response format. The model must be instructed to output JSON
                      in the prompt.
                  - type: object
                    required:
                    - type
                    - json_schema
                    properties:
                      type:
                        enum:
                        - json_schema
                        type: string
                        description: Enable structured outputs to ensure that the model output matches
                          the provided JSON Schema.
                      json_schema:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            description: The name of the response format. It can only contain a-z, A-Z,
                              0-9, underscores, and hyphens.
                          schema:
                            type: object
                            description: The schema of the response format is described using a JSON Schema
                              object.
                            additionalProperties: true
                          strict:
                            type: boolean
                            default: false
                            nullable: true
                            description: Whether to enable strict schema adherence.
                          description:
                            type: string
                            description: Description of the purpose of this response format.
                    description: Use the structured output response format of JSON Schema.
                  description: 'The object format that the specified model must output. Setting it to
                    `{ "type": "json_schema", "json_schema": {...} }` enables structured output; setting
                    it to `{ "type": "json_object" }` enables the older JSON Object mode.'
                presence_penalty:
                  type: number
                  default: 0
                  maximum: 2
                  minimum: -2
                  nullable: true
                  description: The value ranges from -2.0 to 2.0. Positive values will penalize based
                    on whether the token has already appeared in the generated text, thereby increasing
                    the model's likelihood of discussing new topics.
                reasoning_effort:
                  enum:
                  - low
                  - high
                  - max
                  type: string
                  nullable: true
                  description: Only for Kimi K3. K3 always enables inference, and the only currently supported
                    value is `max`; omitting this field will also use `max`. `standard`, `high`, or other
                    strings may be loosely accepted, but there is no guarantee that they will change the
                    inference behavior. Do not pass this field for the K2 series.
                  x-allowed-models:
                  - kimi-k3
                frequency_penalty:
                  type: number
                  default: 0
                  maximum: 2
                  minimum: -2
                  nullable: true
                  description: The value ranges from -2.0 to 2.0. Positive values will penalize based
                    on the frequency of the token appearing in the generated text, thereby reducing the
                    likelihood of the model repeating the same line word for word.
                web_search_options:
                  type: object
                  properties:
                    user_location:
                      type: object
                      nullable: true
                      properties:
                        type:
                          enum:
                          - approximate
                          type: string
                        approximate:
                          type: object
                          properties:
                            city:
                              type: string
                            region:
                              type: string
                            country:
                              type: string
                            timezone:
                              type: string
                      description: Approximate location parameters for search.
                    search_context_size:
                      enum:
                      - low
                      - medium
                      - high
                      type: string
                      default: medium
                      description: High-level guidelines on the size of the context window space occupied
                        by the search.
                  description: Options for web search tools, for use with the GPT-4o model that has built-in
                    search (`gpt-4o-search-preview`, `gpt-4o-mini-search-preview`).
                parallel_tool_calls:
                  type: boolean
                  default: true
                  description: Whether to enable parallel function calls during tool invocation.
                max_completion_tokens:
                  type: integer
                  nullable: true
                  description: The maximum number of tokens that can be generated for a single completion,
                    including visible output tokens and inference tokens. For newer models (o1/o3/o4/gpt-5
                    series and other inference models), this parameter replaces `max_tokens`.
        required: true
      description: 'Kimi Chat Completion API, compatible with the official interface format. Full input
        requirements: https://platform.acedata.cloud/documents/kimi-chat-completions'
      externalDocs:
        url: https://platform.acedata.cloud/documents/kimi-chat-completions
