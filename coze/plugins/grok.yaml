        content:
          application/json:
            schema:
              type: object
              properties:
                async:
                  type: boolean
                  description: Whether to process in asynchronous mode. When set to `true`, the interface
                    immediately returns `task_id`, without the need to provide `callback_url`, and then
                    the result can be obtained by polling the corresponding task query interface; if `callback_url`
                    is also provided, the result will be pushed to that callback address.
                  default: true
                model:
                  enum:
                  - grok-imagine-video-1.5-fast:reverse
                  - grok-imagine-video:reverse
                  - grok-imagine-video:official
                  - grok-imagine-video-1.5:official
                  - grok-imagine-video
                  type: string
                  default: grok-imagine-video-1.5-fast:reverse
                  description: Models used for generating videos. `grok-imagine-video-1.5-fast` supports
                    text-to-video generation and image-to-video generation, with a maximum duration of
                    30 seconds; `grok-imagine-video-1.5` only supports image-to-video generation and requires
                    an `image_url`, with a maximum duration of 15 seconds.
                prompt:
                  type: string
                  description: Describe the text prompts for generating video content. Required when generating
                    text with `grok-imagine-video-1.5-fast`; optional when providing `image_url`.
                duration:
                  type: integer
                  default: 6
                  maximum: 30
                  minimum: 1
                  description: The duration of the generated video, in seconds. `grok-imagine-video-1.5-fast`
                    has a range of 1–30, `grok-imagine-video-1.5` has a range of 1–15, and defaults to
                    6 if not specified. It is recommended to use 6 seconds or 10 seconds, as these two
                    standard durations are relatively stable; the stability of other durations is relatively
                    low.
                image_url:
                  type: string
                  description: Input image URL for image generation video. Required when `model` is `grok-imagine-video-1.5`.
                resolution:
                  enum:
                  - 480p
                  - 720p
                  - 1080p
                  type: string
                  default: 480p
                  description: The output resolution for the video can be selected as `480p`, `720p`,
                    or `1080p`.
                aspect_ratio:
                  enum:
                  - '1:1'
                  - '16:9'
                  - '9:16'
                  - '4:3'
                  - '3:4'
                  - '3:2'
                  - '2:3'
                  type: string
                  description: Generate the aspect ratio of the video.
                callback_url:
                  type: string
                  description: Callback URL, after the video generation is complete, the result will call
                    this address. After providing this parameter, the request will immediately return
                    `task_id`, and the result will be delivered asynchronously.
                reference_image_urls:
                  type: array
                  items:
                    type: string
                  description: An optional array of reference image URLs to guide the style or content
                    of the generated video.
        required: true
