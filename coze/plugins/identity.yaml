openapi: 3.0.1
info:
  title: Identity Verification
  version: 2.0.0
  description: 'Use identity, phone and bank-card verification tools in an explicitly authorized workflow.
    Inputs and results require private handling and an accurate privacy declaration. Bind your own Ace
    Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization. Usage is billed to your
    account. Never place a token in chat or shared examples. Start: https://platform.acedata.cloud/services/a0a76008-85ff-4c46-8db7-76481721b9fb?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /identity/idcard/check-1e:
    post:
      summary: Pass in the portrait photo of the ID card, identify the information on the ID card photo,
        and compare the name, ID card number, portrait photo of the ID card wi
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  sex:
                    type: string
                    description: Gender.
                  sim:
                    type: number
                    description: The facial similarity score ranges from 0.00 to 100.00.
                  name:
                    type: string
                    description: Name.
                  birth:
                    type: string
                    description: Date of birth.
                  id_num:
                    type: string
                    description: ID card number.
                  nation:
                    type: string
                    description: Nation.
                  result:
                    type: string
                    description: Business error codes. Return `success` when the operation is successful;
                      if the operation fails, please refer to the error code list below for detailed explanations.
                  address:
                    type: string
                    description: Address.
                  quality:
                    type: string
                    description: The quality score of the ID card image ranges from 0 to 100. The current
                      default threshold is 50 points, and a blur alert will be triggered when it falls
                      below 50 points.
                  portrait:
                    type: string
                    description: Base64 encoding of the ID card photo. If the portrait cutout fails, compare
                      the entire ID card image and return a null value.
                  warnings:
                    type: string
                    description: Alarm information. When the corresponding alarm items are configured
                      in `config`, if the alarm conditions are triggered, the corresponding alarm content
                      (i.e., OCR alarm) will be returned.
                  encryption:
                    type: array
                    items:
                      type: object
                      properties:
                        iv:
                          type: string
                          description: Encryption initial vector (CBC mode). Users with encryption needs
                            can pass this field, which is a user-defined string, with a length of 16 characters.
                        tag_list:
                          type: array
                          items:
                            type: string
                          description: The message digest list generated by the SM4-GCM algorithm is used
                            to verify message integrity.
                        algorithm:
                          type: string
                          description: Encryption algorithms support `AES-256-CBC` and `SM4-GCM`, with
                            `AES-256-CBC` as the default.
                        encrypt_list:
                          type: array
                          items:
                            type: string
                          description: When using the encryption service, fill in the list of fields that
                            need to be encrypted. This interface supports filling in one or more fields
                            to be encrypted.
                        ciphertext_blob:
                          type: number
                          description: The encrypted symmetric key ciphertext. Please refer to the data
                            encryption-related documentation for the key generation and usage methods.
                      description: Sensitive data encryption information.
                  description:
                    type: string
                    description: Business results description.
          description: OK, request successful.
        '400':
          content:
            application/json:
              schema:
