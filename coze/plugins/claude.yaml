                        description: Output token details. It may be null or omitted when authoritative
                          details are unavailable.
                      cache_read_input_tokens:
                        type: integer
                        minimum: 0
                        nullable: true
                      cache_creation_input_tokens:
                        type: integer
                        minimum: 0
                        nullable: true
                  content:
                    type: array
                    items:
