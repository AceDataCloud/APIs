openapi: 3.0.1
info:
  title: AceData_Claude_Assistant
  version: 2.0.0
  description: 'Write, analyze and revise content with Claude through chat or native Messages tools. Count
    tokens before sending a larger request. Bind your own Ace Data Cloud credential privately as Bearer
    YOUR_API_TOKEN in Authorization. Usage is billed to your account. Never place a token in chat or shared
    examples. Start: https://platform.acedata.cloud/?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /v1/messages/count_tokens:
    post:
      summary: Claude Count Tokens API calculates the number of input tokens.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - input_tokens
                properties:
                  input_tokens:
                    type: integer
                    description: The total number of tokens for the provided message list, system prompts,
                      and tool definitions.
          description: Request successful.
        '400':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - trace_id
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                  trace_id:
                    type: string
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - trace_id
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                  trace_id:
                    type: string
          description: Unauthorized, authorization token is invalid or missing.
        '403':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - trace_id
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                  trace_id:
                    type: string
          description: Access denied, insufficient balance or exceeded quota limit.
        '429':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - trace_id
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                  trace_id:
                    type: string
          description: Too many requests, exceeding rate limit.
        '500':
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - trace_id
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                  trace_id:
                    type: string
          description: Internal server error, an exception occurred on the server side.
