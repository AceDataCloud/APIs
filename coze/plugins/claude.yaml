  /v1/chat/completions:
    post:
      summary: Claude Chat Completion API, compatible with the official API format.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - choices
                - created
                - id
                - model
                - object
                properties:
                  id:
                    type: string
                    description: The unique identifier for dialogue completion.
                  model:
                    type: string
                    description: Model used for completing this conversation.
                  usage:
                    type: object
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    properties:
                      cost:
                        type: object
                        nullable: true
                        required:
                        - amount
                        - currency
                        properties:
                          amount:
                            type: number
                            minimum: 0
                            description: The quota actually consumed by this request.
                          currency:
                            type: string
                            description: Unit of measurement for the quota.
                          list_amount:
                            type: number
                            minimum: 0
                            nullable: true
                            description: Credit amount before discount (if any).
                        description: The quota consumption recorded by Ace Data Cloud for this non-streaming
                          request; may be null or omitted in streaming responses.
                      total_tokens:
                        type: integer
                        minimum: 0
                        description: The total number of tokens used in this request (prompt + completion).
                      prompt_tokens:
                        type: integer
                        minimum: 0
                        description: The number of tokens in the prompt.
                      completion_tokens:
                        type: integer
                        minimum: 0
                        description: The number of tokens in the generated completion content.
                      prompt_tokens_details:
                        type: object
                        nullable: true
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of audio input tokens in the prompt.
                          cached_tokens:
                            type: integer
                            minimum: 0
                            description: The number of tokens in the prompt that hit the cache.
                          cache_write_tokens:
                            type: integer
                            minimum: 0
                            description: The number of input tokens written to the cache for this request.
                        description: Details of token usage for prompts.
                      completion_tokens_details:
                        type: object
                        nullable: true
                        properties:
                          audio_tokens:
                            type: integer
                            minimum: 0
                            description: The number of tokens in the audio output generated by the model.
                          reasoning_tokens:
                            type: integer
                            minimum: 0
                            description: The number of tokens generated by the model for inference.
                          accepted_prediction_tokens:
                            type: integer
                            minimum: 0
                            description: The number of tokens that appear in the completion of the predicted
                              content when using predicted outputs.
                          rejected_prediction_tokens:
                            type: integer
                            minimum: 0
                            description: The number of tokens in the predicted content that do not appear
                              in the completion when using predicted outputs.
                        description: Complete the token usage details.
