openapi: 3.0.1
info:
  title: AceData_Gemini_Studio
  version: 2.0.0
  description: 'Use Gemini chat and native content requests, or create a video and retrieve its completed
    result. Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
    Usage is billed to your account. Never place a token in chat or shared examples. Start: https://platform.acedata.cloud/services/dda998fe-e11f-41b8-afa9-0a9b8420d60d?from=coze'
servers:
- url: https://api.acedata.cloud
paths:
  /v1beta/models/{model}:generateContent:
    post:
      summary: This interface can call the Google Gemini native format API generateContent endpoint, supporting
        functions such as text generation, multimodal understanding, JS
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    type: object
                    required:
                    - prompt_tokens
                    - completion_tokens
                    properties:
                      cost:
                        type: object
                        required:
                        - amount
                        - currency
                        properties:
                          amount:
                            type: number
                            description: The quota consumed by this call.
                          currency:
                            type: string
                            description: Cost unit; the standard quota call is credit.
                          list_amount:
                            type: number
                            description: Consumption of the quota before applying the discount.
                        description: Cost preview for this call.
                        additionalProperties: false
                      total_tokens:
                        type: integer
                        description: The total number of normalized tokens.
                      prompt_tokens:
                        type: integer
                        description: Normalized input token count.
                      thoughts_tokens:
                        type: integer
                        description: The number of tokens used in the thinking process.
                      completion_tokens:
                        type: integer
                        description: Normalized output token count.
                      prompt_tokens_details:
                        type: object
                        properties:
                          modalities:
                            type: array
                            items:
                              type: object
                              required:
                              - modality
                              - tokenCount
                              properties:
                                modality:
                                  type: string
                                tokenCount:
                                  type: integer
                              additionalProperties: false
                            description: Details of tokens for each input modality.
                          text_tokens:
                            type: integer
                            description: Number of text input tokens included in `prompt_tokens`.
                          audio_tokens:
                            type: integer
                            description: Number of audio input tokens included in `prompt_tokens`; recalculated
                              according to the model's audio input pricing and will not be billed repeatedly.
                          image_tokens:
                            type: integer
                            description: The number of image input tokens included in prompt_tokens.
                          video_tokens:
                            type: integer
                            description: The number of video input tokens included in `prompt_tokens`.
                          cached_tokens:
                            type: integer
                          cached_modalities:
                            type: array
                            items:
                              type: object
                              required:
                              - modality
                              - tokenCount
                              properties:
                                modality:
                                  type: string
                                tokenCount:
                                  type: integer
                              additionalProperties: false
                            description: Details of token for each cache hit mode.
                          cached_text_tokens:
                            type: integer
                            description: Number of cached text tokens included in `cached_tokens`.
                          cached_audio_tokens:
                            type: integer
                            description: Number of cached audio tokens included in `cached_tokens`; recalculated
                              according to the model's cached audio pricing and will not be billed repeatedly.
                          cached_image_tokens:
                            type: integer
                            description: The number of image cache tokens included in `cached_tokens`.
                          cached_video_tokens:
                            type: integer
                            description: The number of video cache tokens included in `cached_tokens`.
                        description: Input token cache and modal details.
                        additionalProperties: false
                      tool_use_prompt_tokens:
                        type: integer
                        description: The number of tokens used in the tool call input.
                      completion_tokens_details:
                        type: object
                        properties:
                          modalities:
                            type: array
                            items:
                              type: object
                              required:
                              - modality
                              - tokenCount
                              properties:
                                modality:
                                  type: string
                                tokenCount:
                                  type: integer
                              additionalProperties: false
                            description: Details of tokens for each output modality.
                        description: Output the modal details of the token.
                        additionalProperties: false
                      tool_use_prompt_tokens_details:
                        type: object
                        properties:
                          modalities:
                            type: array
                            items:
                              type: object
                              required:
                              - modality
                              - tokenCount
                              properties:
                                modality:
                                  type: string
                                tokenCount:
                                  type: integer
                              additionalProperties: false
                            description: Details of token input modes for each tool.
                        description: Details of the modal for inputting tokens for tool invocation.
                        additionalProperties: false
                    description: The standardized token usage of Ace Data Cloud and the cost of this call.
                      The cost field may be omitted when the price preview is unavailable.
                    additionalProperties: false
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        content:
                          type: object
                          properties:
                            role:
                              type: string
                            parts:
                              type: array
                              items:
                                type: object
                                properties:
                                  text:
                                    type: string
                                  thought:
                                    type: boolean
                                    description: Is this segment a thinking/reasoning step?
                        finishReason:
                          enum:
                          - STOP
                          - MAX_TOKENS
                          - SAFETY
                          - RECITATION
                          - LANGUAGE
                          - OTHER
                          - BLOCKLIST
                          - PROHIBITED_CONTENT
                          - SPII
                          - MALFORMED_FUNCTION_CALL
                          type: string
                        safetyRatings:
                          type: array
                          items:
                            type: object
                            properties:
                              blocked:
                                type: boolean
                              category:
                                type: string
                              probability:
                                type: string
                  responseId:
                    type: string
                  modelVersion:
                    type: string
                  usageMetadata:
                    type: object
                    properties:
                      totalTokenCount:
                        type: integer
                      promptTokenCount:
                        type: integer
                      cacheTokensDetails:
                        type: array
                        items:
                          type: object
                          properties:
                            modality:
                              type: string
                            tokenCount:
                              type: integer
                      thoughtsTokenCount:
                        type: integer
                      promptTokensDetails:
                        type: array
                        items:
                          type: object
                          properties:
                            modality:
                              type: string
                            tokenCount:
                              type: integer
                      candidatesTokenCount:
                        type: integer
                      cachedContentTokenCount:
                        type: integer
                      candidatesTokensDetails:
                        type: array
                        items:
                          type: object
                          properties:
                            modality:
                              type: string
                            tokenCount:
                              type: integer
                      toolUsePromptTokenCount:
                        type: integer
                      toolUsePromptTokensDetails:
                        type: array
                        items:
                          type: object
                          properties:
                            modality:
                              type: string
                            tokenCount:
                              type: integer
          description: Request successful
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      status:
                        type: string
                      message:
                        type: string
          description: Request error
      parameters:
      - in: path
        name: model
        schema:
          enum:
          - gemini-3.8-flash
          - gemini-3.7-flash
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-3.1-flash-lite
          - gemini-3.1-pro-preview
          - gemini-3-flash-preview
          - gemini-2.5-pro
          - gemini-2.5-flash
          - gemini-2.5-flash-lite
          - gemini-3.1-flash-image
          - gemini-2.5-flash-image
          - gemini-3-pro-image
          type: string
        required: true
        description: 'Model for content generation. Format: model name (without the `models/` prefix).'
      - name: Authorization
        in: header
        required: true
        description: Bind your own Ace Data Cloud credential privately as Bearer YOUR_API_TOKEN in Authorization.
          Usage is billed to your account. Never place a token in chat or shared examples.
        schema:
          type: string
      operationId: generateContent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contents
              properties:
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      functionDeclarations:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          properties:
                            name:
                              type: string
                            parameters:
                              type: object
                              additionalProperties: true
                            description:
                              type: string
                  description: The model can be used to generate a list of custom function declarations
                    for the next response.
                contents:
                  type: array
                  items:
                    type: object
                    required:
                    - parts
                    properties:
                      role:
                        enum:
                        - user
                        - model
                        type: string
                        description: The role of content producers. Must be `user` or `model`.
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              description: Text content.
                            fileData:
                              type: object
                              properties:
                                fileUri:
                                  type: string
                                mimeType:
                                  type: string
                              description: Data based on URI.
                            inlineData:
                              type: object
                              properties:
                                data:
                                  type: string
                                  description: Base64 encoded byte data of the media.
                                mimeType:
                                  type: string
                                  description: IANA standard MIME types of the source data.
                              description: Inline image or video byte data. Audio MIME types are currently
                                not accepted.
                            functionCall:
                              type: object
                              properties:
                                args:
                                  type: object
                                  additionalProperties: true
                                name:
                                  type: string
                              description: The prediction returned by the model is FunctionCall.
                            functionResponse:
                              type: object
                              properties:
                                name:
                                  type: string
                                response:
                                  type: object
                                  additionalProperties: true
                              description: The output of FunctionCall.
                        description: Ordered content segments that make up a single message.
                  description: The current content of the conversation with the model. In a single-turn
                    query, it is a single instance; in a multi-turn query (dialogue), it is a repeated
                    field that includes the dialogue history and the latest request.
                toolConfig:
                  type: object
                  properties:
                    functionCallingConfig:
                      type: object
                      properties:
                        mode:
                          enum:
                          - MODE_UNSPECIFIED
                          - AUTO
                          - ANY
                          - NONE
                          type: string
                        allowedFunctionNames:
                          type: array
                          items:
                            type: string
                  description: Requested tool configuration.
                safetySettings:
                  type: array
                  items:
                    type: object
                    properties:
                      category:
                        enum:
                        - HARM_CATEGORY_HARASSMENT
                        - HARM_CATEGORY_HATE_SPEECH
                        - HARM_CATEGORY_SEXUALLY_EXPLICIT
                        - HARM_CATEGORY_DANGEROUS_CONTENT
                        - HARM_CATEGORY_CIVIC_INTEGRITY
                        type: string
                      threshold:
                        enum:
                        - BLOCK_NONE
                        - BLOCK_ONLY_HIGH
                        - BLOCK_MEDIUM_AND_ABOVE
                        - BLOCK_LOW_AND_ABOVE
                        - 'OFF'
                        type: string
                  description: Security settings used to block unsafe content.
                generationConfig:
                  type: object
                  properties:
                    seed:
                      type: integer
                      description: Random seed for deterministic generation.
                    topK:
                      type: integer
                      description: The maximum number of tokens considered during sampling (Top-K).
                    topP:
                      type: number
                      description: The maximum cumulative probability of tokens considered during sampling
                        (Top-P).
                    imageConfig:
                      type: object
                      properties:
                        imageSize:
                          enum:
                          - '512'
                          - 1K
                          - 2K
                          - 4K
                          type: string
                          description: 'Image size options: `512`, `1K`, `2K`, `4K`.'
                        aspectRatio:
                          type: string
                          description: Generate the aspect ratio of the image, such as `1:1`, `16:9`,
                            `9:16`, `4:3`, etc.
                      description: 'Image output configuration (for image models only, used in conjunction
                        with `responseModalities: [IMAGE]`).'
                    temperature:
                      type: number
                      maximum: 2
                      minimum: 0
                      description: 'Control the randomness of the output. Value range: [0.0, 2.0].'
                    stopSequences:
                      type: array
                      items:
                        type: string
                      description: Generate a character sequence that stops the output (up to 5 characters).
                    candidateCount:
                      type: integer
                      description: The number of generated responses to return.
                    responseSchema:
                      type: object
                      description: Output Schema for generated candidate text (subset of OpenAPI Schema).
                        Used in conjunction with `responseMimeType` of type `application/json`.
                      additionalProperties: true
                    thinkingConfig:
                      type: object
                      properties:
                        thinkingBudget:
                          type: integer
                          description: The budget for the number of tokens that the model should generate
                            for thinking.
                        includeThoughts:
                          type: boolean
                          description: Is the thought process included in the response?
                      description: Configuration of thinking functions (only supports specific models).
                    maxOutputTokens:
                      type: integer
                      description: The maximum number of tokens in the response.
                    presencePenalty:
                      type: number
                      description: Apply a presence penalty to the tokens that have already appeared in
                        the response.
                    frequencyPenalty:
                      type: number
                      description: Frequency penalty applied in proportion to the number of token uses.
                    responseMimeType:
                      enum:
                      - text/plain
                      - application/json
                      - text/x.enum
                      type: string
                      description: 'The MIME types of the generated candidate text. Supported: `text/plain`,
                        `application/json`, `text/x.enum`.'
                    responseModalities:
                      type: array
                      items:
                        enum:
                        - TEXT
                        - IMAGE
                        type: string
                      description: The set of response modalities that the model can return.
                  description: Configuration options for model generation and output.
                systemInstruction:
                  type: object
                  properties:
                    parts:
                      type: array
                      items:
                        type: object
                        properties:
                          text:
                            type: string
                  description: System instructions set by the developer.
        required: true
      description: 'This interface can call the Google Gemini native format API generateContent endpoint,
        supporting functions such as text generation, multimodal understanding, JS Full input requirements:
        https://platform.acedata.cloud/documents/gemini-generate-content-api'
      externalDocs:
        url: https://platform.acedata.cloud/documents/gemini-generate-content-api
  /gemini/chat/completions:
    post:
      summary: Gemini Chat Completion API, compatible with the official API format.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - choices
                - created
                - id
                - model
                - object
                properties:
                  id:
                    type: string
                    description: The unique identifier for dialogue completion.
                  model:
                    type: string
                    description: Model used for completing this conversation.
                  usage:
                    type: object
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    properties:
                      total_tokens:
                        type: integer
                        description: The total number of tokens used in this request (prompt + completion).
                      prompt_tokens:
                        type: integer
                        description: The number of tokens in the prompt.
                      completion_tokens:
                        type: integer
                        description: The number of tokens in the generated completion content.
                      prompt_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of audio input tokens in the prompt.
                          cached_tokens:
                            type: integer
                            description: The number of tokens in the prompt that hit the cache.
                        description: Details of token usage for prompts.
                      completion_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of tokens in the audio output generated by the model.
                          reasoning_tokens:
                            type: integer
                            description: The number of tokens generated by the model for inference.
                          accepted_prediction_tokens:
                            type: integer
                            description: The number of tokens that appear in the completion of the predicted
                              content when using predicted outputs.
                          rejected_prediction_tokens:
                            type: integer
                            description: The number of tokens in the predicted content that do not appear
                              in the completion when using predicted outputs.
                        description: Complete the token usage details.
                    description: Usage statistics for this completion request.
                  object:
                    enum:
                    - chat.completion
                    type: string
                    description: Object type, fixed as `chat.completion`.
                  choices:
                    type: array
                    items:
                      type: object
                      required:
                      - finish_reason
                      - index
                      - message
                      properties:
                        index:
                          type: number
                          description: The index of the option in the list of options.
                        message:
                          type: object
                          required:
                          - role
                          properties:
                            role:
                              enum:
                              - assistant
                              type: string
                              description: The role of the author of the message.
                            audio:
                              type: object
                              nullable: true
                              required:
                              - id
                              - data
                              - expires_at
                              properties:
                                id:
                                  type: string
                                  description: The unique identifier for the audio reply.
                                data:
                                  type: string
                                  description: Base64 encoded audio bytes generated by the model.
                                expires_at:
                                  type: integer
                                  description: The audio reply is no longer available on the server (for
                                    multi-turn conversations) Unix timestamp (seconds).
                                transcript:
                                  type: string
                                  description: Text transcription of audio generated by the model.
                              description: When the audio output modality is requested, this object contains
                                the audio response data returned by the model.
                            content:
                              type: string
                              nullable: true
                              description: Content of the message.
                            refusal:
                              type: string
                              nullable: true
                              description: The message generated by the model to refuse to answer.
                            tool_calls:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - type
                                - function
                                properties:
                                  id:
                                    type: string
                                    description: The ID of the tool call.
                                  type:
                                    enum:
                                    - function
                                    type: string
                                    description: The type of tool invocation. Currently, only `function`
                                      is supported.
                                  function:
                                    type: object
                                    required:
                                    - name
                                    - arguments
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the function to be called.
                                      arguments:
                                        type: string
                                        description: The parameters used when calling the function are
                                          generated by the model in JSON format.
                                    description: Function for model invocation.
                              nullable: true
                              description: Tool calls generated by the model, such as function calls.
                          description: A message completing a dialogue generated by the model.
                        logprobs:
                          type: object
                          nullable: true
                          description: The logarithmic probability information of this option.
                          additionalProperties: true
                        finish_reason:
                          enum:
                          - stop
                          - length
                          - tool_calls
                          - content_filter
                          - function_call
                          type: string
                          description: Reasons for the model to stop generating tokens. If the model reaches
                            a natural stopping point or hits the provided stopping sequence, it is `stop`;
                            if it reaches the maximum token number specified in the request, it is `length`;
                            if content is omitted due to content filter flags, it is `content_filter`;
                            if the model called a tool, it is `tool_calls`; if the model called a function
                            (deprecated), it is `function_call`.
                    description: Dialogue completion options list. If `n` is greater than 1, it may include
                      multiple options.
                  created:
                    type: number
                    description: Create the Unix timestamp (seconds) when this conversation is completed.
                  system_fingerprint:
                    type: string
                    description: This fingerprint indicates the backend configuration used for the model
                      run. It can be used in conjunction with the request parameter `seed` to understand
                      when changes that may affect determinism occurred in the backend.
                description: Indicates a dialogue completion response returned by the model based on the
                  provided input.
            text/event-stream:
              schema:
                type: object
                required:
                - id
                - object
                - created
                - model
                - choices
                properties:
                  id:
                    type: string
                  model:
                    type: string
                  usage:
                    type: object
                    nullable: true
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    properties:
                      total_tokens:
                        type: integer
                        description: The total number of tokens used in this request (prompt + completion).
                      prompt_tokens:
                        type: integer
                        description: The number of tokens in the prompt.
                      completion_tokens:
                        type: integer
                        description: The number of tokens in the generated completion content.
                      prompt_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of audio input tokens in the prompt.
                          cached_tokens:
                            type: integer
                            description: The number of tokens in the prompt that hit the cache.
                        description: Details of token usage for prompts.
                      completion_tokens_details:
                        type: object
                        properties:
                          audio_tokens:
                            type: integer
                            description: The number of tokens in the audio output generated by the model.
                          reasoning_tokens:
                            type: integer
                            description: The number of tokens generated by the model for inference.
                          accepted_prediction_tokens:
                            type: integer
                            description: The number of tokens that appear in the completion of the predicted
                              content when using predicted outputs.
                          rejected_prediction_tokens:
                            type: integer
                            description: The number of tokens in the predicted content that do not appear
                              in the completion when using predicted outputs.
                        description: Complete the token usage details.
                    description: Only return the usage data block before the end when stream_options.include_usage
                      is enabled.
                  object:
                    enum:
                    - chat.completion.chunk
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      required:
                      - index
                      - delta
                      - finish_reason
                      properties:
                        delta:
                          type: object
                          properties:
                            role:
                              enum:
                              - assistant
                              type: string
                              nullable: true
                            content:
                              type: string
                              nullable: true
                            tool_calls:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - type
                                - function
                                properties:
                                  id:
                                    type: string
                                    description: The ID of the tool call.
                                  type:
                                    enum:
                                    - function
                                    type: string
                                    description: The type of tool invocation. Currently, only `function`
                                      is supported.
                                  function:
                                    type: object
                                    required:
                                    - name
                                    - arguments
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the function to be called.
                                      arguments:
                                        type: string
                                        description: The parameters used when calling the function are
                                          generated by the model in JSON format.
                                    description: Function for model invocation.
                              nullable: true
                              description: Tool calls generated by the model, such as function calls.
                            reasoning_content:
                              type: string
                              nullable: true
                        index:
                          type: integer
                        finish_reason:
                          type: string
                          nullable: true
                    description: Incremental output; the usage data block can be an empty array.
                  created:
                    type: integer
                  system_fingerprint:
                    type: string
                    nullable: true
          description: '非流式请求返回 JSON；stream=true 时返回 SSE。每个事件为 data: {chat.completion.chunk}，可选用量数据块的
            choices 为空，最终以 data: [DONE] 结束。'
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Request error, possibly due to missing or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
          description: Unauthorized, authorization token is invalid or missing.
        '429':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response error code.
                        message:
                          type: string
                          description: Error message of the response.
                    trace_id:
                      type: string
                      description: The tracking ID for this request.
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response error code.
                      message:
                        type: string
                        description: Error message of the response.
                  trace_id:
                    type: string
                    description: The tracking ID for this request.
