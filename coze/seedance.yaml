openapi: 3.0.1
info:
  title: AceData Seedance — AI Video Generation
  description: Generate videos using ByteDance Seedance (Doubao) models, powered by AceData Cloud (https://platform.acedata.cloud).
    Import this schema into Coze / 扣子 as a plugin.
  version: 1.0.0
servers:
- url: https://api.acedata.cloud
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
- bearerAuth: []
paths:
  /seedance/videos:
    post:
      operationId: generateVideo
      summary: Generate a Seedance video
      description: Generate video from text, image, audio, or video content. Seedance 2.5 supports up to 30 seconds, multimodal
        reference, edit, and extend. Set async=true or callback_url to receive a task ID immediately.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - content
              properties:
                model:
                  type: string
                  enum:
                  - doubao-seedance-1-0-pro-250528
                  - doubao-seedance-1-0-pro-fast-251015
                  - doubao-seedance-1-5-pro-251215
                  - doubao-seedance-1-0-lite-t2v-250428
                  - doubao-seedance-1-0-lite-i2v-250428
                  - doubao-seedance-2-0-260128
                  - doubao-seedance-2-0-fast-260128
                  - doubao-seedance-2-0-mini-260615
                  - doubao-seedance-2-5-260628
                  example: doubao-seedance-1-0-pro-250528
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                content:
                  type: array
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                  items:
                    oneOf:
                    - type: object
                      required:
                      - type
                      - text
                      properties:
                        type:
                          type: string
                          enum:
                          - text
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        text:
                          type: string
                          maxLength: 1000
                          example: A kitten yawning at the camera. --rs 720p --rt 16:9 --dur 5 --fps 24 --wm true --seed 11
                            --cf false
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                      additionalProperties: false
                      example:
                        type: text
                        text: A kitten yawning at the camera. --rs 720p --rt 16:9 --dur 5 --fps 24 --wm true --seed 11 --cf
                          false
                    - type: object
                      required:
                      - type
                      - image_url
                      properties:
                        type:
                          type: string
                          enum:
                          - image_url
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        image_url:
                          type: object
                          required:
                          - url
                          properties:
                            url:
                              type: string
                              example: https://cdn.acedata.cloud/v8073y.png
                              description: See the Ace Data Cloud Seedance API documentation for this field.
                          additionalProperties: false
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        role:
                          type: string
                          enum:
                          - first_frame
                          - last_frame
                          - reference_image
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                      additionalProperties: false
                      example:
                        type: image_url
                        role: first_frame
                        image_url:
                          url: https://cdn.acedata.cloud/v8073y.png
                    - type: object
                      required:
                      - type
                      - audio_url
                      properties:
                        type:
                          type: string
                          enum:
                          - audio_url
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        audio_url:
                          type: object
                          required:
                          - url
                          properties:
                            url:
                              type: string
                              example: https://cdn.acedata.cloud/suno_demo.mp3
                              description: See the Ace Data Cloud Seedance API documentation for this field.
                          additionalProperties: false
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        role:
                          type: string
                          enum:
                          - reference_audio
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                      additionalProperties: false
                      example:
                        type: audio_url
                        role: reference_audio
                        audio_url:
                          url: https://cdn.acedata.cloud/suno_demo.mp3
                    - type: object
                      required:
                      - type
                      - video_url
                      properties:
                        type:
                          type: string
                          enum:
                          - video_url
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        video_url:
                          type: object
                          required:
                          - url
                          properties:
                            url:
                              type: string
                              example: https://cdn.acedata.cloud/43a57990c0.mp4
                              description: See the Ace Data Cloud Seedance API documentation for this field.
                          additionalProperties: false
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        role:
                          type: string
                          enum:
                          - reference_video
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                      additionalProperties: false
                      example:
                        type: video_url
                        role: reference_video
                        video_url:
                          url: https://cdn.acedata.cloud/43a57990c0.mp4
                    discriminator:
                      propertyName: type
                resolution:
                  type: string
                  enum:
                  - 480p
                  - 720p
                  - 1080p
                  - 4k
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                ratio:
                  type: string
                  enum:
                  - '16:9'
                  - '4:3'
                  - '1:1'
                  - '3:4'
                  - '9:16'
                  - '21:9'
                  - adaptive
                  default: '16:9'
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                duration:
                  type: integer
                  minimum: -1
                  maximum: 30
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                frames:
                  type: integer
                  minimum: 29
                  maximum: 289
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                seed:
                  type: integer
                  minimum: -1
                  maximum: 4294967295
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                camerafixed:
                  type: boolean
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                watermark:
                  type: boolean
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                generate_audio:
                  type: boolean
                  default: false
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                callback_url:
                  type: string
                  format: uri
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                async:
                  rank: 101
                  type: boolean
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                return_last_frame:
                  type: boolean
                  default: false
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                execution_expires_after:
                  type: integer
                  minimum: 3600
                  maximum: 259200
                  default: 172800
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                omni_reference_task_type:
                  type: string
                  enum:
                  - auto
                  - edit
                  - extend
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                output_format:
                  type: string
                  enum:
                  - mp4
                  - mov
                  default: mp4
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                tools:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: See the Ace Data Cloud Seedance API documentation for this field.
            required: true
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  task_id: 93f11baf-347b-4bb4-9520-8653cb46d6a3
                  trace_id: a9063166-26ed-4451-85b5-54e896817c69
                  data:
                    id: cgt-2025******-***
                    model: doubao-seedance-1-0-pro-250528
                    status: succeeded
                    content:
                      video_url: https://platform2.cdn.acedata.cloud/gemini/04a043bd-6b23-4b4e-945c-ce48158c3eee.mp4
                    seed: 10
                    resolution: 720p
                    ratio: '16:9'
                    duration: 5
                    framespersecond: 24
                    execution_expires_after: 172800
                    usage:
                      completion_tokens: 108900
                      total_tokens: 108900
                    created_at: 1743414619
                    updated_at: 1743414673
                properties:
                  success:
                    type: boolean
                    description: See the Ace Data Cloud Seedance API documentation for this field.
                  task_id:
                    type: string
                    description: See the Ace Data Cloud Seedance API documentation for this field.
                  trace_id:
                    type: string
                    description: See the Ace Data Cloud Seedance API documentation for this field.
                  data:
                    type: object
                    description: See the Ace Data Cloud Seedance API documentation for this field.
                    additionalProperties: true
              properties:
                data:
                  type: object
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                  additionalProperties: true
                success:
                  type: boolean
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                task_id:
                  type: string
                  description: See the Ace Data Cloud Seedance API documentation for this field.
                trace_id:
                  type: string
                  description: See the Ace Data Cloud Seedance API documentation for this field.
          description: See the Ace Data Cloud Seedance API documentation for this field.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  example:
                    error:
                      code: token_mismatched
                      message: The specified token is not matched with API.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: token_mismatched
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: The specified token is not matched with API.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
                - type: object
                  example:
                    error:
                      code: api_not_implemented
                      message: The API is not implemented.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: api_not_implemented
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: The API is not implemented.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
                - type: object
                  example:
                    error:
                      code: disabled
                      message: Your application has been disabled by Ace Data Cloud due to abnormal usage behavior, please
                        contact our support to get more information.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: disabled
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: Your application has been disabled by Ace Data Cloud due to abnormal usage behavior, please
                            contact our support to get more information.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
                - type: object
                  example:
                    error:
                      code: bad_request
                      message: model is invalid.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: bad_request
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: model is invalid.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
                - type: object
                  example:
                    error:
                      code: no_token
                      message: No token specified for the request.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: no_token
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: No token specified for the request.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
          description: See the Ace Data Cloud Seedance API documentation for this field.
        '401':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  example:
                    error:
                      code: invalid_token
                      message: The specified token is invalid or wrong.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: invalid_token
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: The specified token is invalid or wrong.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
                - type: object
                  example:
                    error:
                      code: token_expired
                      message: token expired.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: token_expired
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: token expired.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
                - type: object
                  example:
                    error:
                      code: token_mismatched
                      message: token and api does not match.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: token_mismatched
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: token and api does not match.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
          description: See the Ace Data Cloud Seedance API documentation for this field.
        '403':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  example:
                    error:
                      code: used_up
                      message: Your balance is not sufficient for current request, please buy more in Ace Data Cloud.
                    trace_id: 2efa9340-b21b-4e26-9e14-4aac95f343ab
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          example: used_up
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                        message:
                          type: string
                          example: Your balance is not sufficient for current request, please buy more in Ace Data Cloud.
                          description: See the Ace Data Cloud Seedance API documentation for this field.
                    trace_id:
                      type: string
                      description: See the Ace Data Cloud Seedance API documentation for this field.
          description: See the Ace Data Cloud Seedance API documentation for this field.
